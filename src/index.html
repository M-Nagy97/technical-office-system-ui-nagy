<!doctype html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>TechnicalOfficeSystem</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" id="app-theme" href="assets/themes/lara-light-blue/theme.css">
  <script>
    (function () {
      try {
        var dark = localStorage.getItem('technical-office-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        var link = document.getElementById('app-theme');
        if (link && dark) {
          link.href = 'assets/themes/lara-dark-green/theme.css';
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
