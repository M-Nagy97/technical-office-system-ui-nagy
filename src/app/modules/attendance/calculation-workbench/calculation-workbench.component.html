<p-toast />
<div class="workbench-page">
  <h2 class="page-title">{{ 'calculation_workbench.title' | translate }}</h2>
  <p class="page-subtitle text-muted">{{ 'calculation_workbench.subtitle' | translate }}</p>

  <div class="grid">
    <div class="col-12 lg:col-8">
      <p-card [header]="'calculation_workbench.filters' | translate">
        <div class="field grid">
          <label class="col-12 md:col-3" for="wb-name">{{ 'calculation_workbench.name' | translate }}</label>
          <div class="col-12 md:col-9">
            <input
              pInputText
              id="wb-name"
              class="w-full"
              [(ngModel)]="nameFilter"
              [placeholder]="'calculation_workbench.name_placeholder' | translate"
            />
          </div>
        </div>
        <div class="field grid">
          <label class="col-12 md:col-3" for="wb-plan">{{ 'calculation_workbench.plan' | translate }}</label>
          <div class="col-12 md:col-9">
            <p-dropdown
              inputId="wb-plan"
              [options]="planOptions()"
              [(ngModel)]="selectedPlanId"
              optionLabel="label"
              optionValue="value"
              [showClear]="true"
              [placeholder]="'calculation_workbench.all' | translate"
              styleClass="w-full"
            />
          </div>
        </div>
        <div class="field grid">
          <label class="col-12 md:col-3" for="wb-shift">{{ 'calculation_workbench.shift' | translate }}</label>
          <div class="col-12 md:col-9">
            <p-dropdown
              inputId="wb-shift"
              [options]="shiftOptions()"
              [(ngModel)]="selectedShiftId"
              optionLabel="label"
              optionValue="value"
              [showClear]="true"
              [placeholder]="'calculation_workbench.all' | translate"
              styleClass="w-full"
            />
          </div>
        </div>
        <div class="field grid">
          <label class="col-12 md:col-3">{{ 'calculation_workbench.date_from' | translate }}</label>
          <div class="col-12 md:col-4">
            <p-calendar [(ngModel)]="dateFrom" dateFormat="yy-mm-dd" [showIcon]="true" styleClass="w-full" />
          </div>
          <label class="col-12 md:col-1">{{ 'calculation_workbench.date_to' | translate }}</label>
          <div class="col-12 md:col-4">
            <p-calendar [(ngModel)]="dateTo" dateFormat="yy-mm-dd" [showIcon]="true" styleClass="w-full" />
          </div>
        </div>
        <div class="field grid">
          <label class="col-12 md:col-3" for="wb-note">{{ 'calculation_workbench.commit_note' | translate }}</label>
          <div class="col-12 md:col-9">
            <textarea
              pInputTextarea
              id="wb-note"
              [(ngModel)]="commitNote"
              rows="2"
              class="w-full"
              [placeholder]="'calculation_workbench.commit_note_placeholder' | translate"
            ></textarea>
          </div>
        </div>
        <div class="flex flex-wrap gap-2 mt-3">
          <p-button
            [label]="'calculation_workbench.calculate' | translate"
            icon="pi pi-calculator"
            (onClick)="calculate()"
            [loading]="loadingPreview()"
          />
          <p-button
            [label]="'calculation_workbench.save' | translate"
            icon="pi pi-save"
            severity="success"
            (onClick)="save()"
            [loading]="saving()"
            [disabled]="loadingPreview()"
          />
        </div>
      </p-card>
    </div>

    <div class="col-12 lg:col-4">
      <p-card [header]="'calculation_workbench.pairing_title' | translate">
        <div class="pairing-options flex flex-column gap-3">
          <div class="flex align-items-center gap-2">
            <p-radioButton
              name="pairing"
              [value]="PunchPairingMethod.NUMBER_1"
              [(ngModel)]="pairingMethod"
              inputId="p-filo"
            />
            <label for="p-filo" class="m-0 cursor-pointer">
              <span class="font-medium">{{ 'calculation_workbench.pairing_filo' | translate }}</span>
              <small class="block text-muted">{{ 'calculation_workbench.pairing_filo_hint' | translate }}</small>
            </label>
          </div>
          <div class="flex align-items-center gap-2">
            <p-radioButton
              name="pairing"
              [value]="PunchPairingMethod.NUMBER_2"
              [(ngModel)]="pairingMethod"
              inputId="p-fifo"
            />
            <label for="p-fifo" class="m-0 cursor-pointer">
              <span class="font-medium">{{ 'calculation_workbench.pairing_fifo' | translate }}</span>
              <small class="block text-muted">{{ 'calculation_workbench.pairing_fifo_hint' | translate }}</small>
            </label>
          </div>
          <div class="flex align-items-center gap-2">
            <p-radioButton
              name="pairing"
              [value]="PunchPairingMethod.NUMBER_3"
              [(ngModel)]="pairingMethod"
              inputId="p-lilo"
            />
            <label for="p-lilo" class="m-0 cursor-pointer">
              <span class="font-medium">{{ 'calculation_workbench.pairing_lilo' | translate }}</span>
              <small class="block text-muted">{{ 'calculation_workbench.pairing_lilo_hint' | translate }}</small>
            </label>
          </div>
        </div>
      </p-card>
    </div>

    <div class="col-12">
      <p-card [header]="'calculation_workbench.results' | translate">
        <app-shared-table
          [value]="previewRows()"
          [loading]="loadingPreview()"
          [columns]="previewColumns"
          [actions]="previewActions"
          actionsColumnHeader="calculation_workbench.col_view"
          actionsColumnWidth="6rem"
          actionsAlign="center"
          [paginator]="true"
          [rows]="15"
          styleClass="p-datatable-sm"
          [tableStyle]="{ 'min-width': '72rem' }"
        />
      </p-card>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="detailVisible"
  [header]="('calculation_workbench.day_detail_title' | translate) + ': ' + detailEmployeeLabel"
  [modal]="true"
  [style]="{ width: 'min(960px, 98vw)' }"
  [maximizable]="true"
  [dismissableMask]="true"
>
  <app-shared-table
    [value]="detailRows()"
    [loading]="detailLoading"
    [columns]="detailColumns"
    [paginator]="true"
    [rows]="14"
    styleClass="p-datatable-sm"
    [tableStyle]="{ 'min-width': '52rem' }"
    [scrollable]="true"
    scrollHeight="400px"
  >
    <ng-template sharedTableCell="actualIn" let-row>
      {{ row.actualIn ? (row.actualIn | date : 'short') : '—' }}
    </ng-template>

    <ng-template sharedTableCell="actualOut" let-row>
      {{ row.actualOut ? (row.actualOut | date : 'short') : '—' }}
    </ng-template>
  </app-shared-table>
</p-dialog>
