<div class="time-attendance-settings">
  <p-card>
    <div class="list-header">
      <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input
          type="text"
          pInputText
          [ngModel]="searchText()"
          (ngModelChange)="searchText.set($event)"
          placeholder="بحث بالمفتاح أو القيمة أو الوصف..."
        />
      </span>
    </div>
    <app-shared-table
      [value]="filteredSettings()"
      [loading]="loading()"
      [columns]="columns"
      [actions]="actions"
      actionsColumnHeader="إجراءات"
      actionsColumnWidth="8rem"
      [rows]="10"
      [paginator]="true"
      [rowsPerPageOptions]="[10, 25, 50]"
      currentPageReportTemplate="عرض {first} إلى {last} من {totalRecords}"
      [showCurrentPageReport]="true"
      styleClass="p-datatable-sm p-datatable-striped"
      [translateHeader]="false"
      emptyMessage="لا توجد إعدادات"
      [translateEmptyMessage]="false"
    />
  </p-card>
</div>
