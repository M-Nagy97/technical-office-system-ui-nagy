<p-toast position="bottom-left" />

<p-card [header]="'employee_attendance.title' | translate">
  <div class="filters-row">
    <div class="field">
      <label for="emp-att-name">{{ 'employee_attendance.name' | translate }}</label>
      <input
        id="emp-att-name"
        pInputText
        type="text"
        [(ngModel)]="nameFilter"
        (input)="onNameInput()"
        [placeholder]="'employee_attendance.name_placeholder' | translate"
        class="w-full"
      />
    </div>
    <div class="field">
      <label>{{ 'employee_attendance.plan' | translate }}</label>
      <p-dropdown
        class="w-full"
        [options]="planOptions()"
        [(ngModel)]="selectedPlanId"
        optionLabel="label"
        optionValue="value"
        [showClear]="true"
        [placeholder]="'employee_attendance.all' | translate"
        (onChange)="onPlanOrShiftChange()"
      />
    </div>
    <div class="field">
      <label>{{ 'employee_attendance.shift' | translate }}</label>
      <p-dropdown
        class="w-full"
        [options]="shiftOptions()"
        [(ngModel)]="selectedShiftId"
        optionLabel="label"
        optionValue="value"
        [showClear]="true"
        [placeholder]="'employee_attendance.all' | translate"
        (onChange)="onPlanOrShiftChange()"
      />
    </div>
  </div>

  <app-shared-table
    [value]="rows()"
    [loading]="loading()"
    [columns]="directoryColumns"
    [actions]="directoryActions"
    actionsColumnHeader="employee_attendance.col_view"
    actionsColumnWidth="6rem"
    actionsAlign="center"
    [paginator]="true"
    [rows]="15"
    [rowsPerPageOptions]="[15, 30, 50]"
    styleClass="p-datatable-sm p-datatable-striped"
    [tableStyle]="{ 'min-width': '52rem' }"
    [translateHeader]="true"
  />
</p-card>

<p-dialog
  [header]="detailEmployee?.employeeName || ('employee_attendance.dialog_title' | translate)"
  [(visible)]="detailVisible"
  [modal]="true"
  [dismissableMask]="true"
  [style]="{ width: 'min(95vw, 56rem)' }"
  (onHide)="closeDetail()"
>
  <div class="detail-toolbar mb-3 flex flex-wrap gap-3 align-items-end">
    <div class="field">
      <label>{{ 'employee_attendance.date_from' | translate }}</label>
      <p-calendar
        [(ngModel)]="detailFrom"
        dateFormat="yy-mm-dd"
        [showIcon]="true"
        appendTo="body"
        (onSelect)="onDetailRangeChange()"
      />
    </div>
    <div class="field">
      <label>{{ 'employee_attendance.date_to' | translate }}</label>
      <p-calendar
        [(ngModel)]="detailTo"
        dateFormat="yy-mm-dd"
        [showIcon]="true"
        appendTo="body"
        (onSelect)="onDetailRangeChange()"
      />
    </div>
  </div>

  <app-shared-table
    [value]="detailRows()"
    [loading]="detailLoading"
    [columns]="detailColumns"
    styleClass="p-datatable-sm p-datatable-striped"
    [tableStyle]="{ 'min-width': '44rem' }"
    [paginator]="false"
  >
    <ng-template sharedTableCell="dayType" let-row>
      {{ ('employee_attendance.day_type.' + dayTypeKey(row.dayType)) | translate }}
    </ng-template>

    <ng-template sharedTableCell="isHoliday" let-row>
      @if (row.isHoliday) {
        <i class="pi pi-check text-green-600"></i>
      } @else {
        <span>—</span>
      }
    </ng-template>

    <ng-template sharedTableCell="actualIn" let-row>
      {{ row.actualIn ? (row.actualIn | date : 'short') : '—' }}
    </ng-template>

    <ng-template sharedTableCell="actualOut" let-row>
      {{ row.actualOut ? (row.actualOut | date : 'short') : '—' }}
    </ng-template>
  </app-shared-table>
</p-dialog>
