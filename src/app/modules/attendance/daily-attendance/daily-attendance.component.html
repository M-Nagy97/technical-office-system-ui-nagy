<p-toast />
<div class="daily-attendance">
  <p-card [header]="'daily_attendance_page.filters_title' | translate">
    <div class="toolbar flex flex-column lg:flex-row gap-3 align-items-stretch lg:align-items-end">
      <div class="field flex-1" style="min-width: 12rem">
        <label class="block mb-2 font-medium" for="da-from">{{ 'daily_attendance_page.from' | translate }}</label>
        <p-calendar
          id="da-from"
          [ngModel]="dateFrom()"
          (ngModelChange)="onDateFromChange($event)"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
          styleClass="w-full"
        />
      </div>
      <div class="field flex-1" style="min-width: 12rem">
        <label class="block mb-2 font-medium" for="da-to">{{ 'daily_attendance_page.to' | translate }}</label>
        <p-calendar
          id="da-to"
          [ngModel]="dateTo()"
          (ngModelChange)="onDateToChange($event)"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
          styleClass="w-full"
        />
      </div>
      <div class="field flex-1" style="min-width: 16rem">
        <label class="block mb-2 font-medium" for="da-emps">{{ 'daily_attendance_page.employees' | translate }}</label>
        <p-multiSelect
          inputId="da-emps"
          [options]="employeeOptions()"
          [ngModel]="selectedEmployeeIds()"
          (ngModelChange)="selectedEmployeeIds.set($event)"
          optionLabel="label"
          optionValue="value"
          [filter]="true"
          display="chip"
          [showClear]="true"
          styleClass="w-full"
          [placeholder]="'daily_attendance_page.employees' | translate"
        />
      </div>
      <div>
        <button
          pButton
          type="button"
          [label]="'daily_attendance_page.load' | translate"
          icon="pi pi-search"
          (click)="loadGrid()"
          [loading]="loadingGrid()"
        ></button>
      </div>
    </div>

    <div class="toolbar flex flex-wrap gap-2 mt-3">
      <button
        pButton
        type="button"
        [label]="'daily_attendance_page.download_template' | translate"
        icon="pi pi-download"
        class="p-button-outlined p-button-secondary"
        (click)="downloadTemplate()"
      ></button>
      <button
        pButton
        type="button"
        [label]="'daily_attendance_page.upload_file' | translate"
        icon="pi pi-upload"
        class="p-button-outlined"
        [loading]="importingFile()"
        (click)="fileInput.click()"
      ></button>
      <input
        #fileInput
        type="file"
        accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        hidden
        (change)="onAttendanceFileSelected($event)"
      />
      <button
        pButton
        type="button"
        [label]="'daily_attendance_page.add_punch' | translate"
        icon="pi pi-plus"
        class="p-button-outlined"
        (click)="openManualPunchDialog()"
      ></button>
    </div>

    <p class="text-600 text-sm m-0 mt-3">{{ 'daily_attendance_page.import_hint' | translate }}</p>
  </p-card>

  <p-card class="mt-3" [header]="'daily_attendance_page.table_title' | translate">
    <app-shared-table
      [value]="employeeGroups()"
      [loading]="loadingGrid()"
      [columns]="employeeSummaryColumns"
      [actions]="employeeSummaryActions"
      actionsColumnHeader="daily_attendance_page.col_actions"
      [tableStyle]="{ 'min-width': '44rem' }"
    />
  </p-card>
</div>

<p-dialog
  [header]="'daily_attendance_page.detail_title' | translate: { name: detailEmployeeName() }"
  [visible]="showEmployeeDetailDialog()"
  (visibleChange)="showEmployeeDetailDialog.set($event)"
  [modal]="true"
  [style]="{ width: 'min(56rem, 96vw)' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="closeEmployeeDetailDialog()"
>
  <app-shared-table
    [value]="punchesForDetailDialog()"
    [loading]="false"
    [columns]="detailColumns"
    [actions]="detailActions"
    actionsColumnHeader="daily_attendance_page.col_actions"
    actionsColumnWidth="11rem"
    [tableStyle]="{ 'min-width': '52rem' }"
    [rowClass]="detailRowClass"
  >
    <ng-template sharedTableCell="processed" let-row>
      <p-tag
        [value]="row.isProcessed ? ('calculation_workbench.yes' | translate) : ('calculation_workbench.no' | translate)"
        [severity]="row.isProcessed ? 'success' : 'secondary'"
      />
    </ng-template>

    <ng-template sharedTableCell="inCalc" let-row>
      @if (!row.ignoredByCalculation) {
        <p-tag [value]="'daily_attendance_page.in_calc_yes' | translate" severity="success" />
      } @else {
        <p-tag [value]="'daily_attendance_page.in_calc_no' | translate" severity="danger" />
      }
    </ng-template>
  </app-shared-table>
  <ng-template pTemplate="footer">
    <button
      pButton
      type="button"
      [label]="'daily_attendance_page.cancel' | translate"
      icon="pi pi-times"
      class="p-button-text"
      (click)="closeEmployeeDetailDialog()"
    ></button>
  </ng-template>
</p-dialog>

<p-dialog
  [header]="'daily_attendance_page.manual_header' | translate"
  [visible]="showManualPunchDialog()"
  (visibleChange)="showManualPunchDialog.set($event)"
  [modal]="true"
  [style]="{ width: '28rem' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="closeManualPunchDialog()"
>
  <div class="manual-punch-form">
    <div class="p-field">
      <label for="punch-emp">{{ 'daily_attendance_page.pick_employee' | translate }}</label>
      <p-dropdown
        id="punch-emp"
        [options]="employeeOptions()"
        [ngModel]="punchEmployeeId()"
        (ngModelChange)="punchEmployeeId.set($event)"
        optionLabel="label"
        optionValue="value"
        [placeholder]="'daily_attendance_page.pick_employee' | translate"
        [filter]="true"
        styleClass="w-full"
      />
    </div>
    <div class="p-field">
      <label for="punch-type">{{ 'daily_attendance_page.punch_type' | translate }}</label>
      <p-dropdown
        id="punch-type"
        [options]="punchTypeOptions"
        [ngModel]="punchType()"
        (ngModelChange)="punchType.set($event)"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
      />
    </div>
    <div class="p-field">
      <label for="punch-time">{{ 'daily_attendance_page.punch_time' | translate }}</label>
      <p-calendar
        id="punch-time"
        [ngModel]="punchTime()"
        (ngModelChange)="punchTime.set($event)"
        [showTime]="true"
        hourFormat="24"
        dateFormat="dd/mm/yy"
        styleClass="w-full"
      />
    </div>
    <div class="p-field">
      <label for="punch-notes">{{ 'daily_attendance_page.notes' | translate }}</label>
      <input
        id="punch-notes"
        type="text"
        pInputText
        [ngModel]="punchNotes()"
        (ngModelChange)="punchNotes.set($event)"
        class="w-full"
      />
    </div>
  </div>
  <ng-template pTemplate="footer">
    <button
      pButton
      type="button"
      [label]="'daily_attendance_page.cancel' | translate"
      icon="pi pi-times"
      class="p-button-text"
      (click)="closeManualPunchDialog()"
    ></button>
    <button
      pButton
      type="button"
      [label]="'daily_attendance_page.save' | translate"
      icon="pi pi-check"
      (click)="saveManualPunch()"
      [loading]="savingPunch()"
      [disabled]="!punchEmployeeId()"
    ></button>
  </ng-template>
</p-dialog>
