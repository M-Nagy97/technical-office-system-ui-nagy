<p-toast />
<div class="daily-attendance">
  <p-card>
    <div class="toolbar">
      <div class="toolbar-right">
        <label for="att-date">التاريخ:</label>
        <p-calendar
          id="att-date"
          [ngModel]="selectedDate()"
          (ngModelChange)="onDateChange($event)"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
        />
      </div>
      <div class="toolbar-left">
        <button
          pButton
          label="تحميل نموذج Excel/CSV"
          icon="pi pi-download"
          class="p-button-outlined p-button-secondary"
          type="button"
          (click)="downloadTemplate()"
        ></button>
        <button
          pButton
          label="رفع بصمات من ملف"
          icon="pi pi-upload"
          class="p-button-outlined"
          type="button"
          [loading]="importingFile()"
          (click)="fileInput.click()"
        ></button>
        <input
          #fileInput
          type="file"
          accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
          hidden
          (change)="onAttendanceFileSelected($event)"
        />
        <button
          pButton
          label="تسجيل حضور يدوي"
          icon="pi pi-plus"
          (click)="openManualPunchDialog()"
          class="p-button-outlined"
          type="button"
        ></button>
      </div>
    </div>
    <p class="text-600 text-sm m-0 mt-3">
      النموذج: أعمدة <code>EmpId</code>، <code>FingerTime</code> (مثل 2025-03-01T08:00:00)، <code>Direction</code> (In/Out أو 1/2)،
      <code>DeviceId</code> اختياري. بعد الرفع يتم إعادة احتساب أيام الصفوف المستوردة.
    </p>
  </p-card>

  <app-attendance-calculation [workDate]="selectedDate()" [reloadTick]="reloadTick()" />
</div>

<p-dialog
  header="تسجيل حضور يدوي"
  [visible]="showManualPunchDialog()"
  (visibleChange)="showManualPunchDialog.set($event)"
  [modal]="true"
  [style]="{ width: '28rem' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="closeManualPunchDialog()"
>
  <div class="manual-punch-form">
    <div class="p-field">
      <label for="punch-emp">الموظف</label>
      <p-dropdown
        id="punch-emp"
        [options]="employeeOptions()"
        [ngModel]="punchEmployeeId()"
        (ngModelChange)="punchEmployeeId.set($event)"
        optionLabel="label"
        optionValue="value"
        placeholder="اختر الموظف"
        [filter]="true"
        styleClass="w-full"
      />
    </div>
    <div class="p-field">
      <label for="punch-type">نوع التسجيل</label>
      <p-dropdown
        id="punch-type"
        [options]="punchTypeOptions"
        [ngModel]="punchType()"
        (ngModelChange)="punchType.set($event)"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
      />
    </div>
    <div class="p-field">
      <label for="punch-time">التاريخ والوقت</label>
      <p-calendar
        id="punch-time"
        [ngModel]="punchTime()"
        (ngModelChange)="punchTime.set($event)"
        [showTime]="true"
        hourFormat="24"
        dateFormat="dd/mm/yy"
        styleClass="w-full"
      />
    </div>
    <div class="p-field">
      <label for="punch-notes">ملاحظات (اختياري)</label>
      <input
        id="punch-notes"
        type="text"
        pInputText
        [ngModel]="punchNotes()"
        (ngModelChange)="punchNotes.set($event)"
        class="w-full"
      />
    </div>
  </div>
  <ng-template pTemplate="footer">
    <button pButton label="إلغاء" icon="pi pi-times" class="p-button-text" type="button" (click)="closeManualPunchDialog()"></button>
    <button
      pButton
      label="حفظ"
      icon="pi pi-check"
      type="button"
      (click)="saveManualPunch()"
      [loading]="savingPunch()"
      [disabled]="!punchEmployeeId()"
    ></button>
  </ng-template>
</p-dialog>
