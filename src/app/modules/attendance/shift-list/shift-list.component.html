<div class="shift-list">
  <p-card>
    <div class="list-header">
      <a pButton pRipple label="إضافة شيفت" icon="pi pi-plus" routerLink="/attendance/shifts/new" class="p-button-primary"></a>
      <span class="p-input-icon-left search-box">
        <i class="pi pi-search"></i>
        <input
          type="text"
          pInputText
          [ngModel]="searchText()"
          (ngModelChange)="searchText.set($event)"
          placeholder="بحث بالكود أو الاسم..."
        />
      </span>
    </div>
    <app-shared-table
      [value]="filteredShifts()"
      [loading]="loading()"
      [columns]="columns"
      [actions]="actions"
      actionsColumnHeader="إجراءات"
      actionsColumnWidth="8rem"
      [rowsPerPageOptions]="[10, 25, 50]"
      [translateHeader]="false"
      emptyMessage="لا توجد شيفات"
      [translateEmptyMessage]="false"
    >
      <ng-template sharedTableCell="crossesMidnight" let-row>
        <i
          class="pi"
          [class.pi-check]="row.crossesMidnight"
          [class.text-blue-500]="row.crossesMidnight"
          [class.pi-times]="!row.crossesMidnight"
          [class.text-500]="!row.crossesMidnight"
        ></i>
      </ng-template>

      <ng-template sharedTableCell="isActive" let-row>
        <p-tag [value]="row.isActive ? 'نشط' : 'معطل'" [severity]="row.isActive ? 'success' : 'danger'" />
      </ng-template>
    </app-shared-table>
  </p-card>
</div>
