<div class="shift-list">
  <p-card>
    <app-filter-bar
      [search]="searchText()"
      (searchChange)="searchText.set($event)"
      searchPlaceholderKey="shifts.search"
    >
      <ng-container *appHasPermission="'timeattendance.write'">
        <a pButton [label]="'shifts.add' | translate" icon="pi pi-plus" routerLink="/attendance/shifts/new"></a>
      </ng-container>
    </app-filter-bar>
    <app-shared-table
      [value]="filteredShifts()"
      [loading]="loading()"
      [columns]="columns"
      [actions]="actions"
      actionsColumnHeader="common.actions"
      actionsColumnWidth="8rem"
      emptyMessage="shifts.empty"
    >
      <ng-template sharedTableCell="crossesMidnight" let-row>
        <i
          class="pi"
          [class.pi-check]="row.crossesMidnight"
          [class.text-blue-500]="row.crossesMidnight"
          [class.pi-times]="!row.crossesMidnight"
          [class.text-500]="!row.crossesMidnight"
        ></i>
      </ng-template>

      <ng-template sharedTableCell="isActive" let-row>
        <p-tag [value]="(row.isActive ? 'common.active' : 'common.inactive') | translate" [severity]="row.isActive ? 'success' : 'danger'" />
      </ng-template>
    </app-shared-table>
  </p-card>
</div>
