<p-toast position="top-right" />

<div class="enroll-links-page">
  <div class="page-header">
    <div class="header-title">
      <i class="pi pi-id-card header-icon"></i>
      <div>
        <h2>ربط رقم البصمة بالموظف</h2>
        <p class="hint">
          رقم التسجيل على جهاز ZKTeco يجب أن يطابق <strong>رقم الموظف</strong> في النظام حتى تُسجَّل الحضور تلقائياً عند السحب من الجهاز.
        </p>
      </div>
    </div>
    <p-button label="تحديث القائمة" icon="pi pi-refresh" [loading]="loading()" (onClick)="load()" severity="secondary" />
  </div>
  <p-card>
    <p-table [value]="rows()" [loading]="loading()" [paginator]="true" [rows]="15" [rowsPerPageOptions]="[15, 30, 50]" styleClass="p-datatable-sm">
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 35%">الموظف</th>
          <th style="width: 25%">رقم التسجيل الحالي</th>
          <th style="width: 30%">رقم التسجيل على الجهاز</th>
          <th style="width: 10%"></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row>
        <tr>
          <td>{{ row.employeeName }}</td>
          <td>
            <p-tag *ngIf="row.enrollNumber" severity="success" [value]="row.enrollNumber" />
            <span *ngIf="!row.enrollNumber" class="muted">غير مربوط</span>
          </td>
          <td>
            <input pInputText class="w-full" [ngModel]="draftFor(row.employeeId)" (ngModelChange)="setDraft(row.employeeId, $event)" placeholder="مثال: 1001" />
          </td>
          <td>
            <p-button icon="pi pi-check" [loading]="savingId() === row.employeeId" [disabled]="!isDirty(row)" (onClick)="save(row)" pTooltip="حفظ رقم التسجيل فقط" tooltipPosition="left" />
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr><td colspan="4" class="text-center muted">لا يوجد موظفون</td></tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
