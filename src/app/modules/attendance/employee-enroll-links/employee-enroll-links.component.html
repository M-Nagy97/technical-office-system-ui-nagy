<div class="enroll-links-page">
  <app-page-header titleKey="enroll_links.title" subtitleKey="enroll_links.subtitle">
    <button
      pButton
      type="button"
      [label]="'enroll_links.refresh' | translate"
      icon="pi pi-refresh"
      class="p-button-secondary"
      [loading]="loading()"
      (click)="load()"
    ></button>
  </app-page-header>
  <p-card>
    <app-shared-table
      [value]="rows()"
      [loading]="loading()"
      [columns]="columns"
      emptyMessage="enroll_links.empty"
    >
      <ng-template sharedTableCell="enrollNumber" let-row>
        @if (row.enrollNumber) {
          <p-tag severity="success" [value]="row.enrollNumber" />
        } @else {
          <span class="muted">{{ 'enroll_links.unlinked' | translate }}</span>
        }
      </ng-template>
      <ng-template sharedTableCell="draft" let-row>
        <input
          pInputText
          class="w-full"
          [ngModel]="draftFor(row.employeeId)"
          (ngModelChange)="setDraft(row.employeeId, $event)"
          [placeholder]="'enroll_links.placeholder' | translate"
        />
      </ng-template>
      <ng-template sharedTableCell="save" let-row>
        <button
          pButton
          type="button"
          icon="pi pi-check"
          [loading]="savingId() === row.employeeId"
          [disabled]="!isDirty(row)"
          (click)="save(row)"
          [pTooltip]="'enroll_links.save_tooltip' | translate"
          tooltipPosition="left"
        ></button>
      </ng-template>
    </app-shared-table>
  </p-card>
</div>
