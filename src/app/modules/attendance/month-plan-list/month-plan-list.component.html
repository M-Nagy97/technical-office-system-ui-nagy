<div class="month-plan-list">
  <p-card>
    <div class="list-header">
      <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input
          type="text"
          pInputText
          [ngModel]="searchText()"
          (ngModelChange)="searchText.set($event)"
          placeholder="بحث بالسنة أو الشهر أو الحالة..."
        />
      </span>
    </div>
    <p-table
      [value]="filteredPlans()"
      [loading]="loading()"
      [rows]="10"
      [paginator]="true"
      [rowsPerPageOptions]="[10, 25, 50]"
      styleClass="p-datatable-sm p-datatable-striped"
      currentPageReportTemplate="عرض {first} إلى {last} من {totalRecords}"
      [showCurrentPageReport]="true"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>الشهر / السنة</th>
          <th>الحالة</th>
          <th>عدد التفاصيل</th>
          <th style="width: 8rem">إجراءات</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-plan>
        <tr>
          <td>{{ getMonthYearLabel(plan) }}</td>
          <td>{{ plan.status ?? '—' }}</td>
          <td>{{ detailCount(plan) }}</td>
          <td>
            <a
              pButton
              pRipple
              icon="pi pi-eye"
              [routerLink]="['/attendance/month-plans', plan.id]"
              pTooltip="عرض"
              class="p-button-rounded p-button-text p-button-sm"
            ></a>
            <a
              pButton
              pRipple
              icon="pi pi-pencil"
              [routerLink]="['/attendance/month-plans', plan.id, 'edit']"
              pTooltip="تعديل"
              class="p-button-rounded p-button-text p-button-sm"
            ></a>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4">لا توجد خطط شهرية</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="loadingbody">
        <tr>
          <td colspan="4"><i class="pi pi-spin pi-spinner"></i> جاري التحميل...</td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
