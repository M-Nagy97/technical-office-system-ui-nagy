<div class="month-plan-list">
  <p-card>
    <div class="list-header">
      <a pButton pRipple label="إنشاء خطة" icon="pi pi-plus" routerLink="/attendance/plans/new" class="p-button-primary"></a>
      <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input
          type="text"
          pInputText
          [ngModel]="searchText()"
          (ngModelChange)="searchText.set($event)"
          placeholder="بحث بالاسم أو الوصف..."
        />
      </span>
    </div>
    <p-table
      [value]="filteredPlans()"
      [loading]="loading()"
      [rows]="10"
      [paginator]="true"
      [rowsPerPageOptions]="[10, 25, 50]"
      styleClass="p-datatable-sm p-datatable-striped"
      currentPageReportTemplate="عرض {first} إلى {last} من {totalRecords}"
      [showCurrentPageReport]="true"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>الاسم</th>
          <th>الوصف</th>
          <th>حالة النشاط</th>
          <th style="width: 8rem">إجراءات</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-plan>
        <tr>
          <td>{{ plan.name }}</td>
          <td>{{ plan.description ?? '—' }}</td>
          <td>
            <i class="pi" [class.pi-check-circle]="plan.isActive" [class.text-green-500]="plan.isActive" [class.pi-times-circle]="!plan.isActive" [class.text-red-500]="!plan.isActive"></i>
          </td>
          <td>
            <a
              pButton
              pRipple
              icon="pi pi-eye"
              [routerLink]="['/attendance/plans', plan.id]"
              pTooltip="عرض"
              class="p-button-rounded p-button-text p-button-sm"
            ></a>
            <a
              pButton
              pRipple
              icon="pi pi-users"
              [routerLink]="['/attendance/plans', plan.id, 'employees']"
              pTooltip="تعيين موظفين"
              class="p-button-rounded p-button-text p-button-sm"
            ></a>
            <a
              pButton
              pRipple
              icon="pi pi-pencil"
              [routerLink]="['/attendance/plans', plan.id, 'edit']"
              pTooltip="تعديل"
              class="p-button-rounded p-button-text p-button-sm"
            ></a>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4">لا توجد خطط</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="loadingbody">
        <tr>
          <td colspan="4"><i class="pi pi-spin pi-spinner"></i> جاري التحميل...</td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
