<div class="month-plan-list">
  <p-card>
    <div class="list-header">
      <a pButton pRipple label="إنشاء خطة" icon="pi pi-plus" routerLink="/attendance/plans/new" class="p-button-primary"></a>
      <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input
          type="text"
          pInputText
          [ngModel]="searchText()"
          (ngModelChange)="searchText.set($event)"
          placeholder="بحث بالاسم أو الوصف..."
        />
      </span>
    </div>
    <app-shared-table
      [value]="filteredPlans()"
      [loading]="loading()"
      [columns]="columns"
      [actions]="actions"
      actionsColumnHeader="إجراءات"
      actionsColumnWidth="8rem"
      [rows]="10"
      [paginator]="true"
      [rowsPerPageOptions]="[10, 25, 50]"
      currentPageReportTemplate="عرض {first} إلى {last} من {totalRecords}"
      [showCurrentPageReport]="true"
      styleClass="p-datatable-sm p-datatable-striped"
      [tableStyle]="{ 'min-width': '40rem' }"
      [translateHeader]="false"
      emptyMessage="لا توجد خطط"
      [translateEmptyMessage]="false"
    >
      <ng-template sharedTableCell="isActive" let-row>
        <i
          class="pi"
          [class.pi-check-circle]="row.isActive"
          [class.text-green-500]="row.isActive"
          [class.pi-times-circle]="!row.isActive"
          [class.text-red-500]="!row.isActive"
        ></i>
      </ng-template>
    </app-shared-table>
  </p-card>
</div>
