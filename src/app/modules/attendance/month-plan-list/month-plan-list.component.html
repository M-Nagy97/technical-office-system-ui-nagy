<div class="month-plan-list">
  <p-card>
    <app-filter-bar
      [search]="searchText()"
      (searchChange)="searchText.set($event)"
      searchPlaceholderKey="month_plans.search"
    >
      <ng-container *appHasPermission="'timeattendance.write'">
        <a pButton [label]="'month_plans.add' | translate" icon="pi pi-plus" routerLink="/attendance/plans/new"></a>
      </ng-container>
    </app-filter-bar>
    <app-shared-table
      [value]="filteredPlans()"
      [loading]="loading()"
      [columns]="columns"
      [actions]="actions"
      actionsColumnHeader="common.actions"
      actionsColumnWidth="8rem"
      [tableStyle]="{ 'min-width': '40rem' }"
      emptyMessage="month_plans.empty"
    >
      <ng-template sharedTableCell="isActive" let-row>
        <i
          class="pi"
          [class.pi-check-circle]="row.isActive"
          [class.text-green-500]="row.isActive"
          [class.pi-times-circle]="!row.isActive"
          [class.text-red-500]="!row.isActive"
        ></i>
      </ng-template>
    </app-shared-table>
  </p-card>
</div>
