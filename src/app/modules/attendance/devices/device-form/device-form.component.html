<app-crud-dialog
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [header]="(isEdit ? 'devices_form.edit' : 'devices_form.add') | translate"
  [saveLabelKey]="isEdit ? 'common.save' : 'common.add'"
  (save)="onSave()"
  (cancel)="onCancel()"
>
  <form [formGroup]="form" class="device-form-grid">
    <div class="field model-banner">
      <i class="pi pi-info-circle"></i>
      <span>{{ 'devices_form.model_banner' | translate }}</span>
    </div>

    <app-form-field
      labelKey="devices_form.name"
      [required]="true"
      [errorKey]="fieldInvalid('deviceName') ? 'devices_form.name_required' : null"
    >
      <input pInputText formControlName="deviceName" [placeholder]="'devices_form.name_placeholder' | translate" class="w-full" />
    </app-form-field>

    <app-form-field
      labelKey="devices_form.ip"
      [required]="true"
      [errorKey]="fieldInvalid('deviceIp') ? 'devices_form.ip_required' : null"
    >
      <input pInputText formControlName="deviceIp" placeholder="192.168.1.201" class="w-full" dir="ltr" />
    </app-form-field>

    <app-form-field labelKey="devices_form.port" [required]="true">
      <p-inputNumber formControlName="port" [min]="1" [max]="65535" [useGrouping]="false" class="w-full" />
    </app-form-field>

    <app-form-field labelKey="devices_form.comm_key">
      <p-inputNumber formControlName="commPassword" [min]="0" [max]="999999" [useGrouping]="false" class="w-full" />
      <small class="p-hint">{{ 'devices_form.comm_hint' | translate }}</small>
    </app-form-field>

    <app-form-field labelKey="devices_form.location">
      <input pInputText formControlName="location" class="w-full" />
    </app-form-field>

    <div class="field toggle-field">
      <label>{{ 'common.active' | translate }}</label>
      <p-toggleButton formControlName="isActive" [onLabel]="'common.yes' | translate" [offLabel]="'common.no' | translate" />
    </div>
  </form>
</app-crud-dialog>
