<div class="shift-form">
  <p-card [header]="(isEdit() ? 'shifts.edit' : 'shifts.add') | translate">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6">
          <app-form-field
            forId="shiftCode"
            labelKey="common.code"
            [required]="true"
            [errorKey]="isInvalid('shiftCode') ? 'lookups.code_required' : null"
          >
            <input id="shiftCode" type="text" pInputText formControlName="shiftCode" [readonly]="isEdit()" />
          </app-form-field>
        </div>
        <div class="col-12 md:col-6">
          <app-form-field
            forId="shiftName"
            labelKey="common.name"
            [required]="true"
            [errorKey]="isInvalid('shiftName') ? 'lookups.name_required' : null"
          >
            <input id="shiftName" type="text" pInputText formControlName="shiftName" />
          </app-form-field>
        </div>

        <div class="col-12 md:col-3 field flex align-items-center pt-4">
          <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive" />
          <label for="isActive" class="ml-2">{{ 'common.active' | translate }}</label>
        </div>

        <div class="col-12">
          <app-form-section titleKey="shifts.section_times">
            <div class="grid p-fluid">
              <div class="col-12 md:col-6">
                <app-form-field forId="shiftStart" labelKey="shifts.start" [required]="true">
                  <input id="shiftStart" type="time" pInputText formControlName="shiftStart" />
                </app-form-field>
              </div>
              <div class="col-12 md:col-6">
                <app-form-field forId="shiftEnd" labelKey="shifts.end" [required]="true">
                  <input id="shiftEnd" type="time" pInputText formControlName="shiftEnd" />
                </app-form-field>
              </div>
            </div>
          </app-form-section>
        </div>

        <div class="col-12">
          <app-form-section titleKey="shifts.section_fingerprint">
            <div class="grid p-fluid">
              <div class="col-12 md:col-3">
                <app-form-field forId="fingerInFrom" labelKey="shifts.finger_in_from">
                  <input id="fingerInFrom" type="time" pInputText formControlName="fingerInFrom" />
                </app-form-field>
              </div>
              <div class="col-12 md:col-3">
                <app-form-field forId="fingerInTo" labelKey="shifts.finger_in_to">
                  <input id="fingerInTo" type="time" pInputText formControlName="fingerInTo" />
                </app-form-field>
              </div>
              <div class="col-12 md:col-3">
                <app-form-field forId="fingerOutFrom" labelKey="shifts.finger_out_from">
                  <input id="fingerOutFrom" type="time" pInputText formControlName="fingerOutFrom" />
                </app-form-field>
              </div>
              <div class="col-12 md:col-3">
                <app-form-field forId="fingerOutTo" labelKey="shifts.finger_out_to">
                  <input id="fingerOutTo" type="time" pInputText formControlName="fingerOutTo" />
                </app-form-field>
              </div>
            </div>
          </app-form-section>
        </div>

        <div class="col-12">
          <app-form-section titleKey="shifts.section_extra">
            <div class="grid p-fluid">
              <div class="col-12 md:col-3">
                <app-form-field forId="graceInMinutes" labelKey="shifts.grace_in">
                  <p-inputNumber inputId="graceInMinutes" formControlName="graceInMinutes" [min]="0" />
                </app-form-field>
              </div>
              <div class="col-12 md:col-3">
                <app-form-field forId="graceOutMinutes" labelKey="shifts.grace_out">
                  <p-inputNumber inputId="graceOutMinutes" formControlName="graceOutMinutes" [min]="0" />
                </app-form-field>
              </div>
              <div class="col-12 md:col-6">
                <app-form-field forId="minWorkHoursRequired" labelKey="shifts.min_work_hours">
                  <p-inputNumber inputId="minWorkHoursRequired" formControlName="minWorkHoursRequired" [min]="0" [max]="24" />
                </app-form-field>
              </div>

              <div class="col-12 md:col-3 field flex align-items-center">
                <p-checkbox formControlName="allowOvertimeBefore" [binary]="true" inputId="allowOvertimeBefore" />
                <label for="allowOvertimeBefore" class="ml-2">{{ 'shifts.ot_before' | translate }}</label>
              </div>
              @if (form.get('allowOvertimeBefore')?.value) {
                <div class="col-12 md:col-3">
                  <app-form-field forId="maxOvertimeBeforeMin" labelKey="shifts.max_ot_before">
                    <p-inputNumber inputId="maxOvertimeBeforeMin" formControlName="maxOvertimeBeforeMin" [min]="0" />
                  </app-form-field>
                </div>
              }

              <div class="col-12 md:col-3 field flex align-items-center">
                <p-checkbox formControlName="allowOvertimeAfter" [binary]="true" inputId="allowOvertimeAfter" />
                <label for="allowOvertimeAfter" class="ml-2">{{ 'shifts.ot_after' | translate }}</label>
              </div>
              @if (form.get('allowOvertimeAfter')?.value) {
                <div class="col-12 md:col-3">
                  <app-form-field forId="maxOvertimeAfterMin" labelKey="shifts.max_ot_after">
                    <p-inputNumber inputId="maxOvertimeAfterMin" formControlName="maxOvertimeAfterMin" [min]="0" />
                  </app-form-field>
                </div>
              }
            </div>
          </app-form-section>
        </div>
      </div>

      <app-form-actions cancelLink="/attendance/shifts" [saving]="saving()" (save)="submit()" />
    </form>
  </p-card>
</div>
