<div class="plan-schedule-bulk-form">
  <p-card [header]="'bulk_schedule.title' | translate">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6">
          <app-form-field forId="startDate" labelKey="common.from_date" [required]="true">
            <p-calendar inputId="startDate" formControlName="startDate" dateFormat="dd/mm/yy" [showIcon]="true" appendTo="body"></p-calendar>
          </app-form-field>
        </div>
        <div class="col-12 md:col-6">
          <app-form-field forId="endDate" labelKey="common.to_date" [required]="true">
            <p-calendar inputId="endDate" formControlName="endDate" dateFormat="dd/mm/yy" [showIcon]="true" appendTo="body"></p-calendar>
          </app-form-field>
        </div>

        <div class="col-12">
          <app-form-field forId="shiftId" labelKey="bulk_schedule.shift" [required]="true">
            <p-dropdown
              inputId="shiftId"
              [options]="shifts()"
              formControlName="shiftId"
              optionLabel="shiftName"
              optionValue="id"
              [placeholder]="'bulk_schedule.shift_placeholder' | translate"
              [filter]="true"
              filterBy="shiftName"
              appendTo="body"
            ></p-dropdown>
          </app-form-field>
        </div>

        <div class="col-12">
          <app-form-field forId="notes" labelKey="common.notes">
            <textarea id="notes" pInputTextarea formControlName="notes" rows="3"></textarea>
          </app-form-field>
        </div>
      </div>

      <app-form-actions
        [cancelLink]="['/attendance/plans', planId(), 'schedules']"
        [saving]="saving()"
        saveLabelKey="bulk_schedule.save_assign"
        (save)="submit()"
      />
    </form>
  </p-card>
</div>
