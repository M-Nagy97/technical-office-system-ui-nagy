<div class="schedule-list">
  <p-card>
    <div class="list-header">
      <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input
          type="text"
          pInputText
          [ngModel]="searchText()"
          (ngModelChange)="searchText.set($event)"
          placeholder="بحث..."
        />
      </span>
    </div>
    <p-table
      [value]="filteredSchedules()"
      [loading]="loading()"
      [rows]="10"
      [paginator]="true"
      [rowsPerPageOptions]="[10, 25, 50]"
      styleClass="p-datatable-sm p-datatable-striped"
      currentPageReportTemplate="عرض {first} إلى {last} من {totalRecords}"
      [showCurrentPageReport]="true"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>الموظف</th>
          <th>الشيفت</th>
          <th>من تاريخ</th>
          <th>إلى تاريخ</th>
          <th>ملاحظات</th>
          <th style="width: 8rem">إجراءات</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-schedule>
        <tr>
          <td>{{ schedule.employeeId ?? '—' }}</td>
          <td>{{ schedule.shiftId ?? '—' }}</td>
          <td>{{ formatDate(schedule.effectiveFromDate) }}</td>
          <td>{{ formatDate(schedule.effectiveToDate) }}</td>
          <td>{{ schedule.notes ?? '—' }}</td>
          <td>
            <a
              pButton
              pRipple
              icon="pi pi-pencil"
              [routerLink]="['/attendance/schedules', schedule.id, 'edit']"
              pTooltip="تعديل"
              class="p-button-rounded p-button-text p-button-sm"
            ></a>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6">لا توجد جداول</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="loadingbody">
        <tr>
          <td colspan="6"><i class="pi pi-spin pi-spinner"></i> جاري التحميل...</td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
