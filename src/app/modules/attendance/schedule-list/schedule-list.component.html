<div class="schedule-list">
  <p-card [header]="'جدول الخطة'">
    <div class="list-header flex justify-content-between mb-3">
      <div class="flex gap-2">
        <a pButton pRipple label="تعديل جماعي" icon="pi pi-th-large" [routerLink]="['/attendance/plans', planId(), 'schedules', 'bulk']" class="p-button-primary"></a>
        <a pButton pRipple label="إضافة يوم" icon="pi pi-plus" [routerLink]="['/attendance/plans', planId(), 'schedules', 'new']" class="p-button-outlined"></a>
      </div>
      <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input
          type="text"
          pInputText
          [ngModel]="searchText()"
          (ngModelChange)="searchText.set($event)"
          placeholder="بحث..."
        />
      </span>
    </div>
    <p-table
      [value]="filteredSchedules()"
      [loading]="loading()"
      [rows]="31"
      [paginator]="true"
      [rowsPerPageOptions]="[31, 62, 100]"
      styleClass="p-datatable-sm p-datatable-striped"
      currentPageReportTemplate="عرض {first} إلى {last} من {totalRecords}"
      [showCurrentPageReport]="true"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>التاريخ</th>
          <th>الشيفت</th>
          <th>نوع اليوم</th>
          <th>عطلة؟</th>
          <th>ملاحظات</th>
          <th style="width: 5rem">إجراءات</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-schedule>
        <tr>
          <td>{{ formatDate(schedule.scheduleDate) }}</td>
          <td>{{ schedule.shiftId ?? '—' }}</td>
          <td>{{ schedule.dayType }}</td>
          <td>
            <i class="pi" [class.pi-check]="schedule.isHoliday" [class.text-green-500]="schedule.isHoliday" [class.pi-times]="!schedule.isHoliday"></i>
          </td>
          <td>{{ schedule.notes ?? '—' }}</td>
          <td>
            <a
              pButton
              pRipple
              icon="pi pi-pencil"
              [routerLink]="['/attendance/plans', planId(), 'schedules', schedule.id, 'edit']"
              pTooltip="تعديل"
              class="p-button-rounded p-button-text p-button-sm"
            ></a>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6">لا توجد أيام مبرمجة في هذا الجدول</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="loadingbody">
        <tr>
          <td colspan="6"><i class="pi pi-spin pi-spinner"></i> جاري التحميل...</td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
