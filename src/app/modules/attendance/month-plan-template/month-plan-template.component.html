<div class="p-4">
  <p-card header="Month Plan Template" subheader="Schedule shifts for all employees in a plan for a specific month">
    <form [formGroup]="filterForm" (ngSubmit)="generateDays()" class="flex flex-wrap gap-4 align-items-end mb-4">
      <div class="flex flex-column gap-2">
        <label for="plan">Plan</label>
        <p-dropdown 
          id="plan" 
          formControlName="planId" 
          [options]="plans()" 
          optionLabel="name" 
          optionValue="id" 
          placeholder="Select Plan"
          (onChange)="onPlanChange()"
          styleClass="w-full md:w-15rem">
        </p-dropdown>
      </div>

      <div class="flex flex-column gap-2">
        <label for="year">Year</label>
        <p-dropdown 
          id="year" 
          formControlName="year" 
          [options]="years" 
          placeholder="Year"
          styleClass="w-full md:w-8rem">
        </p-dropdown>
      </div>

      <div class="flex flex-column gap-2">
        <label for="month">Month</label>
        <p-dropdown 
          id="month" 
          formControlName="month" 
          [options]="months" 
          optionLabel="label" 
          optionValue="value" 
          placeholder="Month"
          styleClass="w-full md:w-10rem">
        </p-dropdown>
      </div>

      <p-button label="Load / Generate" icon="pi pi-refresh" type="submit" [loading]="loading()"></p-button>
    </form>

    <div *ngIf="days().length > 0" class="fadein">
      <div class="flex justify-content-between align-items-center mb-3">
        <div class="flex gap-2">
          <p-button label="Set default Weekends (Fri/Sat)" icon="pi pi-calendar-times" severity="secondary" size="small" (onClick)="setWeekends()"></p-button>
        </div>
        <p-button label="Save & Sync To Employees" icon="pi pi-save" severity="success" (onClick)="saveTemplate()"></p-button>
      </div>

      <app-shared-table
        [value]="days()"
        [columns]="columns"
        styleClass="p-datatable-sm p-datatable-gridlines"
        [scrollable]="true"
        scrollHeight="500px"
        [paginator]="false"
        [translateHeader]="false"
        emptyMessage="No data"
        [translateEmptyMessage]="false"
        [rowClass]="rowClassForDay"
      >
        <ng-template sharedTableCell="dayName" let-row>
          <p-tag
            [value]="row.dayName"
            [severity]="row.dayType === 2 ? 'warning' : 'info'"
          ></p-tag>
        </ng-template>

        <ng-template sharedTableCell="shiftId" let-row>
          <p-dropdown
            [(ngModel)]="row.shiftId"
            [options]="shifts()"
            optionLabel="shiftName"
            optionValue="id"
            [showClear]="true"
            placeholder="No Shift"
            [disabled]="row.dayType !== 1"
            styleClass="w-full border-none shadow-none"
          ></p-dropdown>
        </ng-template>

        <ng-template sharedTableCell="dayType" let-row>
          <p-dropdown
            [(ngModel)]="row.dayType"
            [options]="dayTypes"
            placeholder="Select Type"
            styleClass="w-full border-none shadow-none"
          ></p-dropdown>
        </ng-template>

        <ng-template sharedTableCell="notes" let-row>
          <input
            type="text"
            pInputText
            [(ngModel)]="row.notes"
            class="w-full border-none shadow-none p-2 bg-transparent"
            placeholder="Add notes..."
          />
        </ng-template>
      </app-shared-table>
    </div>
  </p-card>
</div>

<p-toast></p-toast>
