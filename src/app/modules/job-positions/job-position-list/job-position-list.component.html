<div class="job-position-list">
  <p-card>
    <div class="filter-bar">
      <span class="p-input-icon-left filter-search">
        <i class="pi pi-search"></i>
        <input
          type="text"
          pInputText
          [ngModel]="searchText()"
          (ngModelChange)="searchText.set($event)"
          placeholder="بحث بالرمز أو الاسم أو الوصف..."
        />
      </span>
      <a pButton label="إضافة مسمى وظيفي" icon="pi pi-plus" routerLink="/job-positions/add" class="p-button-primary"></a>
    </div>

    <app-shared-table
      [value]="filteredPositions()"
      [loading]="loading()"
      [columns]="columns"
      [actions]="actions"
      actionsColumnHeader="إجراءات"
      actionsColumnWidth="10rem"
      [tableStyle]="{ 'min-width': '50rem' }"
      [translateHeader]="false"
      emptyMessage="لا توجد بيانات"
      [translateEmptyMessage]="false"
    />
  </p-card>
</div>

<p-toast />
<p-confirmDialog />
<p-confirmPopup />
