<div class="job-position-list">
  <p-card>
    <app-filter-bar [search]="searchText()" (searchChange)="searchText.set($event)" searchPlaceholderKey="job_positions.search">
      <ng-container *appHasPermission="'hr.employees.write'">
        <a pButton [label]="'job_positions.add' | translate" icon="pi pi-plus" routerLink="/job-positions/add"></a>
      </ng-container>
    </app-filter-bar>

    <app-shared-table
      [value]="filteredPositions()"
      [loading]="loading()"
      [columns]="columns"
      [actions]="actions"
      actionsColumnHeader="common.actions"
      actionsColumnWidth="10rem"
      [tableStyle]="{ 'min-width': '50rem' }"
      emptyMessage="common.no_data"
    />
  </p-card>
</div>
