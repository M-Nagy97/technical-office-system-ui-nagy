<div class="job-position-form">
  <p-card [header]="isEdit() ? 'تعديل مسمى وظيفي' : 'إضافة مسمى وظيفي'">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-grid">
        <div class="field" *ngIf="!isEdit()">
          <label for="code">الرمز <span class="required">*</span></label>
          <input id="code" type="text" pInputText formControlName="code" class="w-full" />
          <small class="p-error" *ngIf="form.get('code')?.invalid && form.get('code')?.touched">
            الرمز مطلوب
          </small>
        </div>
        <div class="field">
          <label for="jobGradeId">الدرجة الوظيفية <span class="required">*</span></label>
          <p-dropdown
            id="jobGradeId"
            formControlName="jobGradeId"
            [options]="gradeOptions()"
            optionLabel="label"
            optionValue="value"
            placeholder="اختر الدرجة"
            [showClear]="true"
            styleClass="w-full"
          />
          <small class="p-error" *ngIf="form.get('jobGradeId')?.invalid && form.get('jobGradeId')?.touched">
            الدرجة الوظيفية مطلوبة
          </small>
        </div>
        <div class="field">
          <label for="name">الاسم <span class="required">*</span></label>
          <input id="name" type="text" pInputText formControlName="name" class="w-full" />
          <small class="p-error" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
            الاسم مطلوب
          </small>
        </div>
        <div class="field full-width">
          <label for="description">الوصف</label>
          <textarea id="description" pInputTextarea formControlName="description" rows="3" class="w-full"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button pButton type="submit" label="حفظ" icon="pi pi-check" [loading]="saving()" class="p-button-primary"></button>
        <a pButton label="إلغاء" icon="pi pi-times" routerLink="/job-positions" class="p-button-outlined"></a>
      </div>
    </form>
  </p-card>
</div>
