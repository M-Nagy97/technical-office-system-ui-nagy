<div class="job-position-form">
  <p-card [header]="(isEdit() ? 'job_positions.edit' : 'job_positions.add') | translate">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-grid">
        @if (!isEdit()) {
          <app-form-field
            forId="code"
            labelKey="common.code"
            [required]="true"
            [errorKey]="isInvalid('code') ? 'lookups.code_required' : null"
          >
            <input id="code" type="text" pInputText formControlName="code" />
          </app-form-field>
        }
        <app-form-field
          forId="jobGradeId"
          labelKey="job_grades.title"
          [required]="true"
          [errorKey]="isInvalid('jobGradeId') ? 'lookups.name_required' : null"
        >
          <p-dropdown
            inputId="jobGradeId"
            formControlName="jobGradeId"
            [options]="gradeOptions()"
            optionLabel="label"
            optionValue="value"
            [placeholder]="'job_grades.title' | translate"
            [showClear]="true"
            appendTo="body"
          />
        </app-form-field>
        <app-form-field
          forId="name"
          labelKey="common.name"
          [required]="true"
          [errorKey]="isInvalid('name') ? 'lookups.name_required' : null"
        >
          <input id="name" type="text" pInputText formControlName="name" />
        </app-form-field>
        <app-form-field forId="description" labelKey="common.description">
          <textarea id="description" pInputTextarea formControlName="description" rows="3"></textarea>
        </app-form-field>
      </div>
      <app-form-actions cancelLink="/job-positions" [saving]="saving()" (save)="submit()" />
    </form>
  </p-card>
</div>
