<div class="organization-unit-form">
  <p-card [header]="isEdit() ? 'تعديل وحدة تنظيمية' : 'إضافة وحدة تنظيمية'">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-grid">
        <div class="field" *ngIf="!isEdit()">
          <label for="code">الرمز <span class="required">*</span></label>
          <input id="code" type="text" pInputText formControlName="code" class="w-full" />
          <small class="p-error" *ngIf="form.get('code')?.invalid && form.get('code')?.touched">
            الرمز مطلوب
          </small>
        </div>
        <div class="field">
          <label for="name">الاسم <span class="required">*</span></label>
          <input id="name" type="text" pInputText formControlName="name" class="w-full" />
          <small class="p-error" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
            الاسم مطلوب
          </small>
        </div>
        <div class="field">
          <label for="parentId">الوحدة الأم</label>
          <p-dropdown
            id="parentId"
            formControlName="parentId"
            [options]="parentOptions()"
            optionLabel="label"
            optionValue="value"
            placeholder="اختر الوحدة الأم"
            [showClear]="true"
            styleClass="w-full"
          />
        </div>
      </div>
      <div class="form-actions">
        <button pButton type="submit" label="حفظ" icon="pi pi-check" [loading]="saving()" class="p-button-primary"></button>
        <a pButton label="إلغاء" icon="pi pi-times" routerLink="/organization-units" class="p-button-outlined"></a>
      </div>
    </form>
  </p-card>
</div>
