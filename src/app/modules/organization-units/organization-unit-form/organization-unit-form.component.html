<div class="organization-unit-form">
  <p-card [header]="(isEdit() ? 'organization_units.edit' : 'organization_units.add') | translate">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-grid">
        @if (!isEdit()) {
          <app-form-field
            forId="code"
            labelKey="common.code"
            [required]="true"
            [errorKey]="isInvalid('code') ? 'lookups.code_required' : null"
          >
            <input id="code" type="text" pInputText formControlName="code" />
          </app-form-field>
        }
        <app-form-field
          forId="name"
          labelKey="common.name"
          [required]="true"
          [errorKey]="isInvalid('name') ? 'lookups.name_required' : null"
        >
          <input id="name" type="text" pInputText formControlName="name" />
        </app-form-field>
        <app-form-field forId="parentId" labelKey="organization_units.parent">
          <p-dropdown
            inputId="parentId"
            formControlName="parentId"
            [options]="parentOptions()"
            optionLabel="label"
            optionValue="value"
            [placeholder]="'organization_units.parent_placeholder' | translate"
            [showClear]="true"
            appendTo="body"
          />
        </app-form-field>
      </div>
      <app-form-actions cancelLink="/organization-units" [saving]="saving()" (save)="submit()" />
    </form>
  </p-card>
</div>
