<div class="organization-unit-list">
  <p-card>
    <app-filter-bar [search]="searchText()" (searchChange)="searchText.set($event)" searchPlaceholderKey="organization_units.search">
      <ng-container *appHasPermission="'hr.employees.write'">
        <a pButton [label]="'organization_units.add' | translate" icon="pi pi-plus" routerLink="/organization-units/add"></a>
      </ng-container>
    </app-filter-bar>

    <app-shared-table
      [value]="filteredUnits()"
      [loading]="loading()"
      [columns]="columns"
      [actions]="actions"
      actionsColumnHeader="common.actions"
      actionsColumnWidth="10rem"
      [tableStyle]="{ 'min-width': '40rem' }"
      emptyMessage="common.no_data"
    />
  </p-card>
</div>
