<app-page-header titleKey="custody.documents_title" subtitleKey="custody.documents_subtitle">
  <button pButton type="button" [label]="'custody.refresh' | translate" icon="pi pi-refresh" class="p-button-secondary" (click)="reload()" [loading]="loading()"></button>
  <ng-container *appHasPermission="'custody.write'">
    <button pButton type="button" [label]="'custody.new_document' | translate" icon="pi pi-plus" (click)="openCreate()"></button>
  </ng-container>
  <a routerLink="/custody/financial" pButton class="p-button-outlined" [label]="'custody.financial_module' | translate"></a>
</app-page-header>

<p-card>
  <app-shared-table
    [value]="rows()"
    [loading]="loading()"
    [columns]="columns"
    [actions]="actions"
    actionsColumnHeader="common.actions"
    emptyMessage="custody.no_documents"
  >
    <ng-template sharedTableCell="documentType" let-row>
      {{ docTypeLabel(row.documentType) | translate }}
    </ng-template>
    <ng-template sharedTableCell="status" let-row>
      <p-tag [value]="statusLabel(row.status) | translate" [severity]="statusSeverity(row.status)" />
    </ng-template>
  </app-shared-table>
</p-card>

<app-crud-dialog
  [visible]="createVisible"
  (visibleChange)="createVisible = $event"
  [header]="'custody.new_document' | translate"
  [saving]="loading()"
  (save)="submitCreate()"
>
  <app-form-field labelKey="custody.col.title">
    <input pInputText class="w-full" [(ngModel)]="newTitle" />
  </app-form-field>
  <app-form-field labelKey="custody.col.doc_type">
    <p-dropdown [options]="docTypeOptions" [(ngModel)]="newDocType" optionLabel="label" optionValue="value" styleClass="w-full" appendTo="body" />
  </app-form-field>
  <app-form-field labelKey="custody.initial_holder">
    <p-dropdown
      [options]="employeeOptions()"
      [(ngModel)]="newToEmployeeId"
      optionLabel="label"
      optionValue="value"
      [showClear]="true"
      [placeholder]="'custody.optional' | translate"
      styleClass="w-full"
      appendTo="body"
    />
  </app-form-field>
  @if (newToEmployeeId) {
    <app-form-field labelKey="custody.receive_date">
      <p-calendar [(ngModel)]="newDate" [showTime]="true" hourFormat="12" dateFormat="dd/mm/yy" styleClass="w-full" appendTo="body" />
    </app-form-field>
  }
  <app-form-field labelKey="custody.col.notes">
    <input pInputText class="w-full" [(ngModel)]="newNotes" />
  </app-form-field>
</app-crud-dialog>
