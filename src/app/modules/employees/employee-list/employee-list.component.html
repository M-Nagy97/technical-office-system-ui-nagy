<div class="employee-list">
  <div class="stats-row">
    <app-stat-card icon="pi pi-users" [value]="stats().total" labelKey="employees.list.stat_total" tone="primary" />
    <app-stat-card icon="pi pi-check-circle" [value]="stats().active" labelKey="employees.list.stat_active" tone="success" />
    <app-stat-card icon="pi pi-pause-circle" [value]="stats().suspended" labelKey="employees.list.stat_suspended" tone="warning" />
    <app-stat-card icon="pi pi-star" [value]="stats().newThisMonth" labelKey="employees.list.stat_new_month" tone="info" />
  </div>

  <p-card class="filter-card">
    <app-filter-bar
      [search]="searchText()"
      (searchChange)="searchText.set($event)"
      searchPlaceholderKey="employees.list.search_placeholder"
    >
      <p-dropdown
        [options]="departments()"
        [ngModel]="departmentFilter()"
        (ngModelChange)="departmentFilter.set($event)"
        [placeholder]="'employees.list.filter_department' | translate"
        [showClear]="true"
        styleClass="filter-dropdown"
      />
      <p-dropdown
        [options]="statusOptions"
        [ngModel]="statusFilter()"
        (ngModelChange)="statusFilter.set($event)"
        optionLabel="label"
        optionValue="value"
        [placeholder]="'employees.list.filter_status' | translate"
        [showClear]="true"
        styleClass="filter-dropdown"
      />
      <p-dropdown
        [options]="employmentTypeOptions"
        [ngModel]="employmentTypeFilter()"
        (ngModelChange)="employmentTypeFilter.set($event)"
        optionLabel="label"
        optionValue="value"
        [placeholder]="'employees.list.filter_employment_type' | translate"
        [showClear]="true"
        styleClass="filter-dropdown"
      />
      <ng-container *appHasPermission="'hr.employees.write'">
        <a
          pButton
          [label]="'employees.list.add_employee' | translate"
          icon="pi pi-plus"
          routerLink="/employees/add"
          class="p-button-primary"
        ></a>
      </ng-container>
    </app-filter-bar>
  </p-card>

  <p-card>
    <app-shared-table
      [value]="filteredEmployees()"
      [loading]="loading()"
      [columns]="columns"
      [actions]="actions"
      actionsColumnHeader="employees.list.actions"
      actionsColumnWidth="12rem"
      [rows]="rows()"
      [rowsPerPageOptions]="[10, 25, 50]"
      [currentPageReportTemplate]="pageReportTemplate"
      [showCurrentPageReport]="true"
      styleClass="p-datatable-sm p-datatable-striped"
      [tableStyle]="{ 'min-width': '50rem' }"
      [translateHeader]="true"
      emptyMessage="employees.list.empty"
      [translateEmptyMessage]="true"
    >
      <ng-template sharedTableCell="photo" let-row>
        <p-avatar
          [image]="row.photo"
          [label]="(row.fullName?.charAt(0) || '?')"
          shape="circle"
          size="normal"
          styleClass="table-avatar"
        />
      </ng-template>

      <ng-template sharedTableCell="status" let-row>
        <p-tag [value]="statusLabelKey(row.status) | translate" [severity]="getStatusSeverity(row.status)" />
      </ng-template>
    </app-shared-table>
  </p-card>
</div>
