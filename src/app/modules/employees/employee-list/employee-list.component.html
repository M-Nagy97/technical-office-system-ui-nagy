<div class="employee-list">
  <div class="stats-row">
    <p-card class="stat-card stat-card--total">
      <div class="stat-content">
        <i class="pi pi-users stat-icon"></i>
        <div>
          <span class="stat-value">{{ stats().total }}</span>
          <span class="stat-label">{{ 'employees.list.stat_total' | translate }}</span>
        </div>
      </div>
    </p-card>
    <p-card class="stat-card stat-card--active">
      <div class="stat-content">
        <i class="pi pi-check-circle stat-icon"></i>
        <div>
          <span class="stat-value">{{ stats().active }}</span>
          <span class="stat-label">{{ 'employees.list.stat_active' | translate }}</span>
        </div>
      </div>
    </p-card>
    <p-card class="stat-card stat-card--suspended">
      <div class="stat-content">
        <i class="pi pi-pause-circle stat-icon"></i>
        <div>
          <span class="stat-value">{{ stats().suspended }}</span>
          <span class="stat-label">{{ 'employees.list.stat_suspended' | translate }}</span>
        </div>
      </div>
    </p-card>
    <p-card class="stat-card stat-card--new">
      <div class="stat-content">
        <i class="pi pi-star stat-icon"></i>
        <div>
          <span class="stat-value">{{ stats().newThisMonth }}</span>
          <span class="stat-label">{{ 'employees.list.stat_new_month' | translate }}</span>
        </div>
      </div>
    </p-card>
  </div>

  <p-card class="filter-card">
    <div class="filter-bar">
      <span class="p-input-icon-left filter-search">
        <i class="pi pi-search"></i>
        <input
          type="text"
          pInputText
          [ngModel]="searchText()"
          (ngModelChange)="searchText.set($event)"
          [placeholder]="'employees.list.search_placeholder' | translate"
        />
      </span>
      <p-dropdown
        [options]="departments()"
        [ngModel]="departmentFilter()"
        (ngModelChange)="departmentFilter.set($event)"
        [placeholder]="'employees.list.filter_department' | translate"
        [showClear]="true"
        styleClass="filter-dropdown"
      />
      <p-dropdown
        [options]="statusOptions"
        [ngModel]="statusFilter()"
        (ngModelChange)="statusFilter.set($event)"
        optionLabel="label"
        optionValue="value"
        [placeholder]="'employees.list.filter_status' | translate"
        [showClear]="true"
        styleClass="filter-dropdown"
      />
      <p-dropdown
        [options]="employmentTypeOptions"
        [ngModel]="employmentTypeFilter()"
        (ngModelChange)="employmentTypeFilter.set($event)"
        optionLabel="label"
        optionValue="value"
        [placeholder]="'employees.list.filter_employment_type' | translate"
        [showClear]="true"
        styleClass="filter-dropdown"
      />
      <a
        pButton
        [label]="'employees.list.add_employee' | translate"
        icon="pi pi-plus"
        routerLink="/employees/add"
        class="p-button-primary"
      ></a>
    </div>
  </p-card>

  <p-card>
    <app-shared-table
      [value]="filteredEmployees()"
      [loading]="loading()"
      [columns]="columns"
      [actions]="actions"
      actionsColumnHeader="employees.list.actions"
      actionsColumnWidth="10rem"
      [rows]="rows()"
      [rowsPerPageOptions]="[10, 25, 50]"
      [currentPageReportTemplate]="pageReportTemplate"
      [showCurrentPageReport]="true"
      styleClass="p-datatable-sm p-datatable-striped"
      [tableStyle]="{ 'min-width': '50rem' }"
      [translateHeader]="true"
      emptyMessage="employees.list.empty"
      [translateEmptyMessage]="true"
    >
      <ng-template sharedTableCell="photo" let-row>
        <p-avatar
          [image]="row.photo"
          [label]="(row.fullName?.charAt(0) || '?')"
          shape="circle"
          size="normal"
          styleClass="table-avatar"
        />
      </ng-template>

      <ng-template sharedTableCell="status" let-row>
        <p-tag [value]="statusLabelKey(row.status) | translate" [severity]="getStatusSeverity(row.status)" />
      </ng-template>
    </app-shared-table>
  </p-card>
</div>
