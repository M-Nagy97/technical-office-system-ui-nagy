<div class="employee-list">
  <div class="stats-row">
    <p-card class="stat-card stat-card--total">
      <div class="stat-content">
        <i class="pi pi-users stat-icon"></i>
        <div>
          <span class="stat-value">{{ stats().total }}</span>
          <span class="stat-label">إجمالي الموظفين</span>
        </div>
      </div>
    </p-card>
    <p-card class="stat-card stat-card--active">
      <div class="stat-content">
        <i class="pi pi-check-circle stat-icon"></i>
        <div>
          <span class="stat-value">{{ stats().active }}</span>
          <span class="stat-label">نشط</span>
        </div>
      </div>
    </p-card>
    <p-card class="stat-card stat-card--suspended">
      <div class="stat-content">
        <i class="pi pi-pause-circle stat-icon"></i>
        <div>
          <span class="stat-value">{{ stats().suspended }}</span>
          <span class="stat-label">موقوف</span>
        </div>
      </div>
    </p-card>
    <p-card class="stat-card stat-card--new">
      <div class="stat-content">
        <i class="pi pi-star stat-icon"></i>
        <div>
          <span class="stat-value">{{ stats().newThisMonth }}</span>
          <span class="stat-label">جدد هذا الشهر</span>
        </div>
      </div>
    </p-card>
  </div>

  <p-card class="filter-card">
    <div class="filter-bar">
      <span class="p-input-icon-left filter-search">
        <i class="pi pi-search"></i>
        <input
          type="text"
          pInputText
          [ngModel]="searchText()"
          (ngModelChange)="searchText.set($event)"
          placeholder="بحث بالاسم أو رقم الموظف..."
        />
      </span>
      <p-dropdown
        [options]="departments()"
        [ngModel]="departmentFilter()"
        (ngModelChange)="departmentFilter.set($event)"
        placeholder="القسم"
        [showClear]="true"
        styleClass="filter-dropdown"
      />
      <p-dropdown
        [options]="statusOptions"
        [ngModel]="statusFilter()"
        (ngModelChange)="statusFilter.set($event)"
        optionLabel="label"
        optionValue="value"
        placeholder="الحالة"
        [showClear]="true"
        styleClass="filter-dropdown"
      />
      <p-dropdown
        [options]="employmentTypeOptions"
        [ngModel]="employmentTypeFilter()"
        (ngModelChange)="employmentTypeFilter.set($event)"
        optionLabel="label"
        optionValue="value"
        placeholder="نوع التعيين"
        [showClear]="true"
        styleClass="filter-dropdown"
      />
      <a pButton label="إضافة موظف" icon="pi pi-plus" routerLink="/employees/add" class="p-button-primary"></a>
    </div>
  </p-card>

  <p-card>
    <app-shared-table
      [value]="filteredEmployees()"
      [loading]="loading()"
      [columns]="columns"
      [actions]="actions"
      actionsColumnHeader="إجراءات"
      actionsColumnWidth="10rem"
      [rows]="rows()"
      [rowsPerPageOptions]="[10, 25, 50]"
      currentPageReportTemplate="عرض {first} إلى {last} من {totalRecords}"
      [showCurrentPageReport]="true"
      styleClass="p-datatable-sm p-datatable-striped"
      [tableStyle]="{ 'min-width': '50rem' }"
      [translateHeader]="false"
      emptyMessage="لا توجد بيانات"
      [translateEmptyMessage]="false"
    >
      <ng-template sharedTableCell="photo" let-row>
        <p-avatar
          [image]="row.photo"
          [label]="(row.fullName?.charAt(0) || '?')"
          shape="circle"
          size="normal"
          styleClass="table-avatar"
        />
      </ng-template>

      <ng-template sharedTableCell="status" let-row>
        <p-tag [value]="getStatusLabel(row.status)" [severity]="getStatusSeverity(row.status)" />
      </ng-template>
    </app-shared-table>
  </p-card>
</div>
