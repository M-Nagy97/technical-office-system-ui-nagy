<div class="appointment-documents">
  <p-confirmDialog />
  <p-card>
    <div class="toolbar">
      <div class="filters">
        <p-dropdown
          [options]="employeeOptions()"
          [ngModel]="employeeFilter()"
          (ngModelChange)="employeeFilter.set($event)"
          optionLabel="label"
          optionValue="value"
          [placeholder]="'employees.documents.filter_employee' | translate"
          [showClear]="true"
          styleClass="filter-dropdown"
        />
        <p-dropdown
          [options]="typeOptions"
          [ngModel]="typeFilter()"
          (ngModelChange)="typeFilter.set($event)"
          optionLabel="label"
          optionValue="value"
          [placeholder]="'employees.documents.filter_type' | translate"
          [showClear]="true"
          styleClass="filter-dropdown"
        />
        <p-calendar
          [ngModel]="dateRange()[0]"
          (ngModelChange)="dateRange.set([$event, dateRange()[1]])"
          [placeholder]="'employees.documents.date_from' | translate"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
        />
        <p-calendar
          [ngModel]="dateRange()[1]"
          (ngModelChange)="dateRange.set([dateRange()[0], $event])"
          [placeholder]="'employees.documents.date_to' | translate"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
        />
      </div>
      <button
        pButton
        [label]="'employees.documents.upload_button' | translate"
        icon="pi pi-upload"
        (click)="openUpload()"
        class="p-button-primary"
      ></button>
    </div>

    <app-shared-table
      [value]="filteredRows()"
      [columns]="columns"
      [actions]="actions"
      [loading]="loading()"
      actionsColumnHeader="employees.documents.actions"
      actionsColumnWidth="8rem"
      styleClass="p-datatable-sm p-datatable-striped"
      [tableStyle]="{ 'min-width': '50rem' }"
      [translateHeader]="true"
      emptyMessage="employees.documents.empty"
      [translateEmptyMessage]="true"
    />
  </p-card>
</div>

<p-dialog
  [header]="'employees.documents.upload_dialog_title' | translate"
  [visible]="uploadDialogVisible()"
  (visibleChange)="uploadDialogVisible.set($event)"
  [modal]="true"
  [style]="{ width: '32rem' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="closeUpload()"
>
  <div class="upload-dialog-content">
    <p>{{ 'employees.documents.upload_dialog_hint' | translate }}</p>
    <p-dropdown
      [options]="employeeOptions()"
      [ngModel]="uploadEmployeeId()"
      (ngModelChange)="uploadEmployeeId.set($event)"
      optionLabel="label"
      optionValue="value"
      [placeholder]="'employees.documents.filter_employee' | translate"
      styleClass="w-full"
    />
    <p-dropdown
      [options]="uploadTypeOptions"
      [ngModel]="uploadDocType()"
      (ngModelChange)="uploadDocType.set($event)"
      optionLabel="label"
      optionValue="value"
      [placeholder]="'employees.documents.filter_type' | translate"
      styleClass="w-full"
    />
    <input
      pInputText
      class="w-full"
      [ngModel]="uploadDocName()"
      (ngModelChange)="uploadDocName.set($event)"
      [placeholder]="'employees.documents.doc_name_optional' | translate"
    />
    <p-fileUpload
      mode="advanced"
      [auto]="false"
      [customUpload]="true"
      [multiple]="true"
      [disabled]="uploading()"
      (uploadHandler)="onUploadFile($event)"
      [chooseLabel]="'employees.documents.choose_files' | translate"
      [uploadLabel]="'employees.documents.upload' | translate"
      [cancelLabel]="'employees.documents.cancel' | translate"
    />
  </div>
  <ng-template pTemplate="footer">
    <button
      pButton
      [label]="'employees.documents.cancel' | translate"
      (click)="closeUpload()"
      class="p-button-text"
      [disabled]="uploading()"
    ></button>
  </ng-template>
</p-dialog>

<app-document-preview-dialog
  [visible]="documentPreviewVisible()"
  (visibleChange)="documentPreviewVisible.set($event)"
  [document]="previewDocument()"
  headerKey="document_preview.default_header"
  [downloadFileName]="previewDownloadFileName()"
/>
