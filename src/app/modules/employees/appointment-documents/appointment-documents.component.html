<div class="appointment-documents">
  <p-confirmDialog />
  <p-card>
    <div class="toolbar">
      <div class="filters">
        <p-dropdown
          [options]="employeeOptions()"
          [ngModel]="employeeFilter()"
          (ngModelChange)="employeeFilter.set($event)"
          optionLabel="label"
          optionValue="value"
          placeholder="الموظف"
          [showClear]="true"
          styleClass="filter-dropdown"
        />
        <p-dropdown
          [options]="typeOptions"
          [ngModel]="typeFilter()"
          (ngModelChange)="typeFilter.set($event)"
          optionLabel="label"
          optionValue="value"
          placeholder="نوع المستند"
          [showClear]="true"
          styleClass="filter-dropdown"
        />
        <p-calendar
          [ngModel]="dateRange()[0]"
          (ngModelChange)="dateRange.set([$event, dateRange()[1]])"
          placeholder="من تاريخ"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
        />
        <p-calendar
          [ngModel]="dateRange()[1]"
          (ngModelChange)="dateRange.set([dateRange()[0], $event])"
          placeholder="إلى تاريخ"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
        />
      </div>
      <button pButton label="رفع مستند" icon="pi pi-upload" (click)="openUpload()" class="p-button-primary"></button>
    </div>

    <app-shared-table
      [value]="filteredRows()"
      [columns]="columns"
      [actions]="actions"
      [loading]="loading()"
      actionsColumnHeader="إجراءات"
      actionsColumnWidth="8rem"
      styleClass="p-datatable-sm p-datatable-striped"
      [tableStyle]="{ 'min-width': '50rem' }"
      [translateHeader]="false"
      emptyMessage="لا توجد مستندات."
      [translateEmptyMessage]="false"
    />
  </p-card>
</div>

<p-dialog
  header="رفع مستند جديد"
  [visible]="uploadDialogVisible()"
  (visibleChange)="uploadDialogVisible.set($event)"
  [modal]="true"
  [style]="{ width: '32rem' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="closeUpload()"
>
  <div class="upload-dialog-content">
    <p>اختر الموظف ونوع المستند ثم ارفع ملفاً أو أكثر.</p>
    <p-dropdown
      [options]="employeeOptions()"
      [ngModel]="uploadEmployeeId()"
      (ngModelChange)="uploadEmployeeId.set($event)"
      optionLabel="label"
      optionValue="value"
      placeholder="الموظف"
      styleClass="w-full"
    />
    <p-dropdown
      [options]="uploadTypeOptions"
      [ngModel]="uploadDocType()"
      (ngModelChange)="uploadDocType.set($event)"
      optionLabel="label"
      optionValue="value"
      placeholder="نوع المستند"
      styleClass="w-full"
    />
    <input
      pInputText
      class="w-full"
      [ngModel]="uploadDocName()"
      (ngModelChange)="uploadDocName.set($event)"
      placeholder="اسم المستند (اختياري)"
    />
    <p-fileUpload
      mode="advanced"
      [auto]="false"
      [customUpload]="true"
      [multiple]="true"
      [disabled]="uploading()"
      (uploadHandler)="onUploadFile($event)"
      chooseLabel="اختر ملفات"
      uploadLabel="رفع"
      cancelLabel="إلغاء"
    />
  </div>
  <ng-template pTemplate="footer">
    <button pButton label="إلغاء" (click)="closeUpload()" class="p-button-text" [disabled]="uploading()"></button>
  </ng-template>
</p-dialog>

<app-document-preview-dialog
  [visible]="documentPreviewVisible()"
  (visibleChange)="documentPreviewVisible.set($event)"
  [document]="previewDocument()"
  headerKey="document_preview.default_header"
  [downloadFileName]="previewDownloadFileName()"
/>
