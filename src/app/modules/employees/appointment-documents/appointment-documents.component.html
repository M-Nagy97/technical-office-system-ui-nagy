<div class="appointment-documents">
  <p-card>
    <div class="toolbar">
      <div class="filters">
        <p-dropdown
          [options]="employeeOptions()"
          [ngModel]="employeeFilter()"
          (ngModelChange)="employeeFilter.set($event)"
          optionLabel="label"
          optionValue="value"
          placeholder="الموظف"
          [showClear]="true"
          styleClass="filter-dropdown"
        />
        <p-dropdown
          [options]="typeOptions"
          [ngModel]="typeFilter()"
          (ngModelChange)="typeFilter.set($event)"
          optionLabel="label"
          optionValue="value"
          placeholder="نوع المستند"
          [showClear]="true"
          styleClass="filter-dropdown"
        />
        <p-calendar
          [ngModel]="dateRange()[0]"
          (ngModelChange)="dateRange.set([$event, dateRange()[1]])"
          placeholder="من تاريخ"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
        />
        <p-calendar
          [ngModel]="dateRange()[1]"
          (ngModelChange)="dateRange.set([dateRange()[0], $event])"
          placeholder="إلى تاريخ"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
        />
      </div>
      <button pButton label="رفع مستند" icon="pi pi-upload" (click)="openUpload()" class="p-button-primary"></button>
    </div>

    <app-shared-table
      [value]="filteredRows()"
      [columns]="columns"
      [actions]="actions"
      actionsColumnHeader="إجراءات"
      actionsColumnWidth="8rem"
      styleClass="p-datatable-sm p-datatable-striped"
      [tableStyle]="{ 'min-width': '50rem' }"
      [translateHeader]="false"
      emptyMessage="لا توجد مستندات."
      [translateEmptyMessage]="false"
    />
  </p-card>
</div>

<p-dialog
  header="رفع مستند جديد"
  [visible]="uploadDialogVisible()"
  (visibleChange)="uploadDialogVisible.set($event)"
  [modal]="true"
  [style]="{ width: '28rem' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="closeUpload()"
>
  <div class="upload-dialog-content">
    <p>اختر الموظف ثم الملف.</p>
    <p-dropdown
      [options]="employeeOptions()"
      optionLabel="label"
      optionValue="value"
      placeholder="الموظف"
      styleClass="w-full"
    />
    <p-fileUpload
      mode="advanced"
      [auto]="false"
      chooseLabel="اختر ملف"
      uploadLabel="رفع"
      cancelLabel="إلغاء"
      [multiple]="false"
    />
  </div>
  <ng-template pTemplate="footer">
    <button pButton label="إلغاء" (click)="closeUpload()" class="p-button-text"></button>
    <button pButton label="رفع" icon="pi pi-upload" (click)="onUploadFile()"></button>
  </ng-template>
</p-dialog>

<p-dialog
  header="معاينة المستند"
  [visible]="previewDialogVisible()"
  (visibleChange)="previewDialogVisible.set($event)"
  [modal]="true"
  [style]="{ width: '40rem' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="closePreview()"
>
  @if (previewDoc(); as doc) {
    <div class="preview-content">
      <p><strong>الموظف:</strong> {{ doc.employeeName }}</p>
      <p><strong>نوع المستند:</strong> {{ doc.typeLabel }}</p>
      <p><strong>الاسم:</strong> {{ doc.name }}</p>
      <p><strong>تاريخ الرفع:</strong> {{ formatDate(doc.uploadDate) }}</p>
      @if (doc.fileUrl) {
        <a [href]="doc.fileUrl" target="_blank" rel="noopener" pButton label="فتح الملف" icon="pi pi-external-link" class="p-button-outlined"></a>
      } @else {
        <p class="text-secondary">لا يوجد رابط ملف (وضع تجريبي).</p>
      }
    </div>
  }
  <ng-template pTemplate="footer">
    <button pButton label="إغلاق" (click)="closePreview()"></button>
  </ng-template>
</p-dialog>
