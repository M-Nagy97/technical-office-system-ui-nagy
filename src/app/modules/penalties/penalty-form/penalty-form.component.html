<ng-template #penaltyFields>
  <form [formGroup]="form" class="penalty-form">
    <app-form-field
      forId="emp"
      labelKey="common.employee"
      [required]="true"
      [errorKey]="isInvalid('employeeId') ? 'common.required' : null"
    >
      <p-autoComplete
        inputId="emp"
        [suggestions]="employeeSuggestions()"
        (completeMethod)="searchEmployee($event)"
        (onSelect)="onEmployeeSelect($event)"
        (onClear)="onEmployeeClear()"
        field="fullName"
        [ngModel]="selectedEmployee()"
        [ngModelOptions]="{ standalone: true }"
        [placeholder]="'penalties.employee_placeholder' | translate"
        [dropdown]="false"
        styleClass="w-full"
        appendTo="body"
      />
    </app-form-field>
    <app-form-field labelKey="penalties.type" [required]="true">
      <p-dropdown
        formControlName="type"
        [options]="typeOptions"
        optionLabel="labelKey"
        optionValue="value"
        [placeholder]="'common.select' | translate"
        styleClass="w-full"
        appendTo="body"
      >
        <ng-template let-item pTemplate="item">{{ item.labelKey | translate }}</ng-template>
        <ng-template let-item pTemplate="selectedItem">{{ item.labelKey | translate }}</ng-template>
      </p-dropdown>
    </app-form-field>
    <app-form-field
      forId="reason"
      labelKey="penalties.reason"
      [required]="true"
      [errorKey]="isInvalid('reason') ? 'common.required' : null"
    >
      <input id="reason" pInputText formControlName="reason" class="w-full" />
    </app-form-field>
    <div class="field-row">
      <app-form-field labelKey="penalties.incident_date" [required]="true">
        <p-calendar formControlName="incidentDate" dateFormat="dd/mm/yy" [showIcon]="true" styleClass="w-full" appendTo="body" />
      </app-form-field>
      <app-form-field labelKey="penalties.decision_date" [required]="true">
        <p-calendar formControlName="decisionDate" dateFormat="dd/mm/yy" [showIcon]="true" styleClass="w-full" appendTo="body" />
      </app-form-field>
    </div>
    <app-form-field
      forId="decisionNumber"
      labelKey="penalties.decision_number"
      [required]="true"
      [errorKey]="isInvalid('decisionNumber') ? 'common.required' : null"
    >
      <input id="decisionNumber" pInputText formControlName="decisionNumber" class="w-full" />
    </app-form-field>
    @if (showDeductionDays()) {
      <app-form-field forId="deductionDays" labelKey="penalties.deduction_days">
        <input id="deductionDays" type="number" pInputText formControlName="deductionDays" min="0" class="w-full" />
      </app-form-field>
    }
    @if (showSuspensionDays()) {
      <app-form-field forId="suspensionDays" labelKey="penalties.suspension_days">
        <input id="suspensionDays" type="number" pInputText formControlName="suspensionDays" min="0" class="w-full" />
      </app-form-field>
    }
    <div class="field-row">
      <app-form-field labelKey="common.status">
        <p-dropdown formControlName="status" [options]="statusOptions" optionLabel="labelKey" optionValue="value" styleClass="w-full" appendTo="body">
          <ng-template let-item pTemplate="item">{{ item.labelKey | translate }}</ng-template>
          <ng-template let-item pTemplate="selectedItem">{{ item.labelKey | translate }}</ng-template>
        </p-dropdown>
      </app-form-field>
      <app-form-field forId="approvedBy" labelKey="penalties.approved_by">
        <input id="approvedBy" pInputText formControlName="approvedBy" class="w-full" />
      </app-form-field>
    </div>
    <app-form-field forId="notes" labelKey="common.notes">
      <textarea id="notes" pInputTextarea formControlName="notes" rows="3" class="w-full"></textarea>
    </app-form-field>
  </form>
</ng-template>

@if (dialogMode()) {
  <app-crud-dialog
    [visible]="true"
    [header]="'penalties.add' | translate"
    [showFooter]="false"
    (cancel)="close()"
  >
    <ng-container *ngTemplateOutlet="penaltyFields" />
    <app-form-actions [flush]="true" (save)="submit()" (cancel)="close()">
      <button pButton type="button" [label]="'penalties.print_decision' | translate" icon="pi pi-print" class="p-button-outlined" (click)="printDecision()"></button>
    </app-form-actions>
  </app-crud-dialog>
} @else {
  <div class="penalty-form-page">
    <app-page-header titleKey="penalties.add" subtitleKey="penalties.add_subtitle" />
    <p-card styleClass="penalty-form-card">
      <ng-container *ngTemplateOutlet="penaltyFields" />
      <app-form-actions (save)="submit()" (cancel)="close()">
        <button pButton type="button" [label]="'penalties.print_decision' | translate" icon="pi pi-print" class="p-button-outlined" (click)="printDecision()"></button>
      </app-form-actions>
    </p-card>
  </div>
}
