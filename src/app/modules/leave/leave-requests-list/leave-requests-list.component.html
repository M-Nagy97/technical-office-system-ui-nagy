<div class="leave-requests-list">
  <p-card>
    <div class="header-toolbar flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <div class="page-title">
        <h2 class="m-0 text-xl font-bold text-900">طلبات الإجازات</h2>
        <span class="text-sm text-500">إدارة ومتابعة طلبات الإجازات المقدمة من الموظفين</span>
      </div>

      <a
        pButton
        label="طلب إجازة جديد"
        icon="pi pi-plus"
        routerLink="/leave/requests/new"
        class="p-button-primary"
      ></a>
    </div>

    <!-- Filters Bar -->
    <div class="filter-section p-3 border-round surface-ground mb-4">
      <div class="grid p-fluid align-items-end">
        <!-- الموظف -->
        <div class="col-12 sm:col-6 md:col-3">
          <label class="block text-sm font-medium mb-1">الموظف</label>
          <p-dropdown
            [options]="employees()"
            [ngModel]="selectedEmployeeId()"
            (ngModelChange)="selectedEmployeeId.set($event)"
            optionLabel="fullName"
            optionValue="id"
            placeholder="جميع الموظفين"
            [showClear]="true"
            [filter]="true"
            filterBy="fullName,employeeNumber"
          ></p-dropdown>
        </div>

        <!-- نوع الإجازة -->
        <div class="col-12 sm:col-6 md:col-3">
          <label class="block text-sm font-medium mb-1">نوع الإجازة</label>
          <p-dropdown
            [options]="leaveTypes()"
            [ngModel]="selectedLeaveTypeId()"
            (ngModelChange)="selectedLeaveTypeId.set($event)"
            optionLabel="arabicName"
            optionValue="id"
            placeholder="جميع الأنواع"
            [showClear]="true"
          ></p-dropdown>
        </div>

        <!-- الحالة -->
        <div class="col-12 sm:col-6 md:col-2">
          <label class="block text-sm font-medium mb-1">الحالة</label>
          <p-dropdown
            [options]="statusOptions"
            [ngModel]="selectedStatus()"
            (ngModelChange)="selectedStatus.set($event)"
            optionLabel="label"
            optionValue="value"
            placeholder="الحالة"
          ></p-dropdown>
        </div>

        <!-- من تاريخ -->
        <div class="col-12 sm:col-6 md:col-2">
          <label class="block text-sm font-medium mb-1">من تاريخ</label>
          <p-calendar
            [ngModel]="fromDate()"
            (ngModelChange)="fromDate.set($event)"
            dateFormat="yy-mm-dd"
            placeholder="من تاريخ"
            [showIcon]="true"
            [showClear]="true"
          ></p-calendar>
        </div>

        <!-- إلى تاريخ -->
        <div class="col-12 sm:col-6 md:col-2">
          <label class="block text-sm font-medium mb-1">إلى تاريخ</label>
          <p-calendar
            [ngModel]="toDate()"
            (ngModelChange)="toDate.set($event)"
            dateFormat="yy-mm-dd"
            placeholder="إلى تاريخ"
            [showIcon]="true"
            [showClear]="true"
          ></p-calendar>
        </div>

        <!-- Filter action buttons -->
        <div class="col-12 flex justify-content-end gap-2 mt-2">
          <button
            pButton
            type="button"
            label="تطبيق الفلتر"
            icon="pi pi-filter"
            class="p-button-primary p-button-sm"
            (click)="loadRequests()"
          ></button>
          <button
            pButton
            type="button"
            label="إعادة تعيين"
            icon="pi pi-refresh"
            class="p-button-outlined p-button-secondary p-button-sm"
            (click)="resetFilters()"
          ></button>
        </div>
      </div>
    </div>

    <!-- Data Table -->
    <app-shared-table
      [value]="requests()"
      [loading]="loading()"
      [columns]="columns"
      [actions]="actions"
      actionsColumnHeader="إجراءات"
      actionsColumnWidth="12rem"
      [tableStyle]="{ 'min-width': '55rem' }"
      [translateHeader]="false"
      emptyMessage="لا توجد طلبات إجازة مطابقة للبحث"
      [translateEmptyMessage]="false"
    >
      <ng-template sharedTableCell="status" let-row>
        <app-status-badge [status]="row.status" type="leave" />
      </ng-template>
    </app-shared-table>
  </p-card>
</div>

<!-- Action Dialog (Approve / Reject / Cancel) -->
<app-leave-action-dialog
  [(visible)]="actionDialogOpen"
  [action]="currentAction()"
  [requestId]="currentRequestId()"
  [loading]="actionLoading()"
  (confirmed)="handleActionConfirm($event)"
/>
