<div class="permission-request-form-container">
  <p-card [header]="'leave.permissions.create_title' | translate">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid p-fluid">
        <!-- الموظف -->
        <div class="col-12 md:col-6 field">
          <label for="employeeId" class="font-medium">{{ 'leave.permissions.field_employee' | translate }} <span class="text-red-500">*</span></label>
          <p-dropdown
            id="employeeId"
            formControlName="employeeId"
            [options]="employees()"
            optionLabel="fullName"
            optionValue="id"
            [placeholder]="'leave.permissions.field_employee_placeholder' | translate"
            [filter]="true"
            filterBy="fullName,employeeNumber"
            [showClear]="true"
          ></p-dropdown>
          <small
            class="p-error block mt-1"
            *ngIf="form.get('employeeId')?.invalid && form.get('employeeId')?.touched"
          >
            {{ 'leave.permissions.field_employee_req' | translate }}
          </small>
        </div>

        <!-- التاريخ -->
        <div class="col-12 md:col-6 field">
          <label for="date" class="font-medium">{{ 'leave.permissions.field_date' | translate }} <span class="text-red-500">*</span></label>
          <p-calendar
            id="date"
            formControlName="date"
            dateFormat="yy-mm-dd"
            [placeholder]="'leave.permissions.field_date_placeholder' | translate"
            [showIcon]="true"
          ></p-calendar>
          <small
            class="p-error block mt-1"
            *ngIf="form.get('date')?.invalid && form.get('date')?.touched"
          >
            {{ 'leave.permissions.field_date_req' | translate }}
          </small>
        </div>

        <!-- نوع المدة (Radio) -->
        <div class="col-12 field">
          <label class="font-medium block mb-2">{{ 'leave.permissions.field_duration_type' | translate }} <span class="text-red-500">*</span></label>
          <div class="flex flex-wrap gap-4">
            <div class="flex align-items-center">
              <p-radioButton
                id="typeTimeRange"
                [value]="PermissionDurationType.TimeRange"
                formControlName="durationType"
              ></p-radioButton>
              <label for="typeTimeRange" class="mr-2 cursor-pointer font-medium">{{ 'leave.permissions.duration_custom_time' | translate }}</label>
            </div>

            <div class="flex align-items-center">
              <p-radioButton
                id="typeHalfDay"
                [value]="PermissionDurationType.HalfDay"
                formControlName="durationType"
              ></p-radioButton>
              <label for="typeHalfDay" class="mr-2 cursor-pointer font-medium">{{ 'leave.permissions.duration_half_day' | translate }}</label>
            </div>
          </div>
        </div>

        <!-- نطاق زمني: من الساعة - إلى الساعة -->
        <ng-container *ngIf="form.get('durationType')?.value === PermissionDurationType.TimeRange">
          <div class="col-12 md:col-6 field">
            <label for="fromTime" class="font-medium">{{ 'leave.permissions.field_from_time' | translate }} <span class="text-red-500">*</span></label>
            <p-calendar
              id="fromTime"
              formControlName="fromTime"
              [timeOnly]="true"
              [showTime]="true"
              hourFormat="24"
              placeholder="00:00"
              [showIcon]="true"
              icon="pi pi-clock"
            ></p-calendar>
            <small
              class="p-error block mt-1"
              *ngIf="form.get('fromTime')?.invalid && form.get('fromTime')?.touched"
            >
              {{ 'leave.permissions.field_from_time_req' | translate }}
            </small>
          </div>

          <div class="col-12 md:col-6 field">
            <label for="toTime" class="font-medium">{{ 'leave.permissions.field_to_time' | translate }} <span class="text-red-500">*</span></label>
            <p-calendar
              id="toTime"
              formControlName="toTime"
              [timeOnly]="true"
              [showTime]="true"
              hourFormat="24"
              placeholder="00:00"
              [showIcon]="true"
              icon="pi pi-clock"
            ></p-calendar>
            <small
              class="p-error block mt-1"
              *ngIf="form.get('toTime')?.invalid && form.get('toTime')?.touched"
            >
              {{ 'leave.permissions.field_to_time_req' | translate }}
            </small>
          </div>
        </ng-container>

        <!-- نصف يوم: صباحية / مسائية -->
        <ng-container *ngIf="form.get('durationType')?.value === PermissionDurationType.HalfDay">
          <div class="col-12 field">
            <label class="font-medium block mb-2">{{ 'leave.permissions.field_period' | translate }} <span class="text-red-500">*</span></label>
            <div class="flex flex-wrap gap-4">
              <div class="flex align-items-center">
                <p-radioButton
                  id="periodMorning"
                  [value]="HalfDayPeriod.Morning"
                  formControlName="halfDayPeriod"
                ></p-radioButton>
                <label for="periodMorning" class="mr-2 cursor-pointer font-medium">{{ 'leave.permissions.period_morning' | translate }}</label>
              </div>

              <div class="flex align-items-center">
                <p-radioButton
                  id="periodAfternoon"
                  [value]="HalfDayPeriod.Afternoon"
                  formControlName="halfDayPeriod"
                ></p-radioButton>
                <label for="periodAfternoon" class="mr-2 cursor-pointer font-medium">{{ 'leave.permissions.period_afternoon' | translate }}</label>
              </div>
            </div>
            <small
              class="p-error block mt-1"
              *ngIf="form.get('halfDayPeriod')?.invalid && form.get('halfDayPeriod')?.touched"
            >
              {{ 'leave.permissions.field_period_req' | translate }}
            </small>
          </div>
        </ng-container>

        <!-- السبب / ملاحظات -->
        <div class="col-12 field">
          <label for="reason" class="font-medium">{{ 'leave.permissions.field_reason' | translate }}</label>
          <textarea
            id="reason"
            pInputTextarea
            formControlName="reason"
            rows="3"
            [placeholder]="'leave.permissions.field_reason_placeholder' | translate"
            class="w-full"
          ></textarea>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="form-actions mt-4 flex gap-2">
        <button
          pButton
          type="submit"
          [label]="'leave.permissions.submit_btn' | translate"
          icon="pi pi-send"
          [loading]="submitting()"
          class="p-button-primary"
        ></button>
        <button
          pButton
          type="button"
          [label]="'common.cancel' | translate"
          icon="pi pi-times"
          (click)="cancel()"
          class="p-button-outlined p-button-secondary"
        ></button>
      </div>
    </form>
  </p-card>
</div>
