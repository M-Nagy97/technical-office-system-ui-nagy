<div class="leave-list">
  <p-card>
    <div class="filter-bar">
      <span class="p-input-icon-left filter-search">
        <i class="pi pi-search"></i>
        <input
          type="text"
          pInputText
          [ngModel]="searchText()"
          (ngModelChange)="searchText.set($event)"
          [placeholder]="'leave.types.search_placeholder' | translate"
        />
      </span>

      <a
        pButton
        [label]="'leave.types.add_button' | translate"
        icon="pi pi-plus"
        routerLink="/leave/types/add"
        class="p-button-primary"
      ></a>
    </div>

    <app-shared-table
      [value]="filteredLeaveTypes()"
      [loading]="loading()"
      [columns]="columns"
      [actions]="actions"
      actionsColumnHeader="leave.types.actions"
      actionsColumnWidth="8rem"
      [tableStyle]="{ 'min-width': '40rem' }"
      [translateHeader]="true"
      emptyMessage="leave.types.empty"
      [translateEmptyMessage]="true"
    ></app-shared-table>
  </p-card>
</div>

<p-confirmDialog />
