<div class="leave-list">
  <p-card>
    <app-filter-bar
      [search]="searchText()"
      (searchChange)="searchText.set($event)"
      searchPlaceholderKey="leave.types.search_placeholder"
    >
      <ng-container *appHasPermission="'leave.write'">
        <a pButton [label]="'leave.types.add_button' | translate" icon="pi pi-plus" routerLink="/leave/types/add"></a>
      </ng-container>
    </app-filter-bar>

    <app-shared-table
      [value]="filteredLeaveTypes()"
      [loading]="loading()"
      [columns]="columns"
      [actions]="actions"
      actionsColumnHeader="leave.types.actions"
      actionsColumnWidth="8rem"
      [tableStyle]="{ 'min-width': '40rem' }"
      [translateHeader]="true"
      emptyMessage="leave.types.empty"
      [translateEmptyMessage]="true"
    ></app-shared-table>
  </p-card>
</div>
