<div class="leave-request-form-container">
  <p-card header="تقديم طلب إجازة جديد">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid p-fluid">
        <!-- الموظف -->
        <div class="col-12 md:col-6 field">
          <label for="employeeId" class="font-medium">الموظف <span class="text-red-500">*</span></label>
          <p-dropdown
            id="employeeId"
            formControlName="employeeId"
            [options]="employees()"
            optionLabel="fullName"
            optionValue="id"
            placeholder="اختر الموظف"
            [filter]="true"
            filterBy="fullName,employeeNumber"
            [showClear]="true"
          ></p-dropdown>
          <small
            class="p-error block mt-1"
            *ngIf="form.get('employeeId')?.invalid && form.get('employeeId')?.touched"
          >
            يرجى تحديد الموظف
          </small>
        </div>

        <!-- نوع الإجازة -->
        <div class="col-12 md:col-6 field">
          <label for="leaveTypeId" class="font-medium">نوع الإجازة <span class="text-red-500">*</span></label>
          <p-dropdown
            id="leaveTypeId"
            formControlName="leaveTypeId"
            [options]="leaveTypes()"
            optionLabel="arabicName"
            optionValue="id"
            placeholder="اختر نوع الإجازة"
            [showClear]="true"
          ></p-dropdown>
          <small
            class="p-error block mt-1"
            *ngIf="form.get('leaveTypeId')?.invalid && form.get('leaveTypeId')?.touched"
          >
            يرجى تحديد نوع الإجازة
          </small>
        </div>

        <!-- تاريخ البداية -->
        <div class="col-12 md:col-6 field">
          <label for="startDate" class="font-medium">تاريخ البداية <span class="text-red-500">*</span></label>
          <p-calendar
            id="startDate"
            formControlName="startDate"
            dateFormat="yy-mm-dd"
            placeholder="حدد تاريخ البداية"
            [showIcon]="true"
          ></p-calendar>
          <small
            class="p-error block mt-1"
            *ngIf="form.get('startDate')?.invalid && form.get('startDate')?.touched"
          >
            تاريخ البداية مطلوب
          </small>
        </div>

        <!-- تاريخ النهاية -->
        <div class="col-12 md:col-6 field">
          <label for="endDate" class="font-medium">تاريخ النهاية <span class="text-red-500">*</span></label>
          <p-calendar
            id="endDate"
            formControlName="endDate"
            dateFormat="yy-mm-dd"
            placeholder="حدد تاريخ النهاية"
            [showIcon]="true"
          ></p-calendar>
          <small
            class="p-error block mt-1"
            *ngIf="form.get('endDate')?.invalid && form.get('endDate')?.touched"
          >
            تاريخ النهاية مطلوب
          </small>
        </div>

        <!-- إجمالي الأيام (محسوب تلقائياً) -->
        <div class="col-12 field">
          <div class="p-3 border-round surface-50 flex align-items-center justify-content-between">
            <span class="font-medium text-700">إجمالي الأيام المحسوبة:</span>
            <span
              class="text-xl font-bold"
              [class.text-primary]="computedDays() !== null && computedDays()! > 0"
              [class.text-red-500]="computedDays() === 0"
            >
              <ng-container *ngIf="computedDays() === null">--</ng-container>
              <ng-container *ngIf="computedDays() !== null && computedDays()! > 0">
                {{ computedDays() }} يوم
              </ng-container>
              <ng-container *ngIf="computedDays() === 0">
                تاريخ النهاية يسبق تاريخ البداية!
              </ng-container>
            </span>
          </div>
        </div>

        <!-- مستند مرفق (يظهر ويتطلب فقط إذا كان نوع الإجازة يتطلب مستنداً) -->
        <div class="col-12 field" *ngIf="requiresDocument()">
          <label for="attachmentUrl" class="font-medium">
            رابط المستند المرفق (طبي / رسمي) <span class="text-red-500">*</span>
          </label>
          <div class="p-inputgroup">
            <span class="p-inputgroup-addon"><i class="pi pi-link"></i></span>
            <input
              id="attachmentUrl"
              type="text"
              pInputText
              formControlName="attachmentUrl"
              placeholder="أدخل رابط المستند أو التقرير الطبي..."
            />
          </div>
          <small
            class="p-error block mt-1"
            *ngIf="form.get('attachmentUrl')?.invalid && form.get('attachmentUrl')?.touched"
          >
            نوع الإجازة المختار يتطلب إرفاق مستند
          </small>
        </div>

        <!-- السبب / ملاحظات -->
        <div class="col-12 field">
          <label for="reason" class="font-medium">سبب الإجازة</label>
          <textarea
            id="reason"
            pInputTextarea
            formControlName="reason"
            rows="3"
            placeholder="أدخل أي ملاحظات أو توضيحات إضافية حول سبب الإجازة..."
            class="w-full"
          ></textarea>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="form-actions mt-4 flex gap-2">
        <button
          pButton
          type="submit"
          label="تقديم الطلب"
          icon="pi pi-send"
          [loading]="submitting()"
          class="p-button-primary"
        ></button>
        <button
          pButton
          type="button"
          label="إلغاء"
          icon="pi pi-times"
          (click)="cancel()"
          class="p-button-outlined p-button-secondary"
        ></button>
      </div>
    </form>
  </p-card>
</div>
