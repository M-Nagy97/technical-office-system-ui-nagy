<div class="job-grade-form">
  <p-card [header]="(isEdit() ? 'job_grades.edit' : 'job_grades.add') | translate">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-grid">
        @if (!isEdit()) {
          <app-form-field
            forId="code"
            labelKey="common.code"
            [required]="true"
            [errorKey]="isInvalid('code') ? 'lookups.code_required' : null"
          >
            <input id="code" type="text" pInputText formControlName="code" />
          </app-form-field>
        }
        <app-form-field
          forId="name"
          labelKey="common.name"
          [required]="true"
          [errorKey]="isInvalid('name') ? 'lookups.name_required' : null"
        >
          <input id="name" type="text" pInputText formControlName="name" />
        </app-form-field>
        <app-form-field
          forId="rank"
          labelKey="common.rank"
          [required]="true"
          [errorKey]="isInvalid('rank') ? 'job_grades.rank_required' : null"
        >
          <p-inputNumber inputId="rank" formControlName="rank" [min]="0" [useGrouping]="false" />
        </app-form-field>
      </div>
      <app-form-actions
        cancelLink="/job-grades"
        [saving]="saving()"
        (save)="submit()"
      />
    </form>
  </p-card>
</div>
