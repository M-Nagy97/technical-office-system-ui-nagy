<div class="job-grade-form">
  <p-card [header]="isEdit() ? 'تعديل درجة وظيفية' : 'إضافة درجة وظيفية'">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-grid">
        <div class="field" *ngIf="!isEdit()">
          <label for="code">الرمز <span class="required">*</span></label>
          <input id="code" type="text" pInputText formControlName="code" class="w-full" />
          <small class="p-error" *ngIf="form.get('code')?.invalid && form.get('code')?.touched">
            الرمز مطلوب
          </small>
        </div>
        <div class="field">
          <label for="name">الاسم <span class="required">*</span></label>
          <input id="name" type="text" pInputText formControlName="name" class="w-full" />
          <small class="p-error" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
            الاسم مطلوب
          </small>
        </div>
        <div class="field">
          <label for="rank">الرتبة <span class="required">*</span></label>
          <p-inputNumber id="rank" formControlName="rank" [min]="0" [useGrouping]="false" class="w-full" />
          <small class="p-error" *ngIf="form.get('rank')?.invalid && form.get('rank')?.touched">
            الرتبة مطلوبة ويجب أن تكون ≥ 0
          </small>
        </div>
      </div>
      <div class="form-actions">
        <button pButton type="submit" label="حفظ" icon="pi pi-check" [loading]="saving()" class="p-button-primary"></button>
        <a pButton label="إلغاء" icon="pi pi-times" routerLink="/job-grades" class="p-button-outlined"></a>
      </div>
    </form>
  </p-card>
</div>
