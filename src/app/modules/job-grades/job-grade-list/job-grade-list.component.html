<div class="job-grade-list">
  <p-card>
    <app-filter-bar [search]="searchText()" (searchChange)="searchText.set($event)" searchPlaceholderKey="job_grades.search">
      <ng-container *appHasPermission="'hr.employees.write'">
        <a pButton [label]="'job_grades.add' | translate" icon="pi pi-plus" routerLink="/job-grades/add"></a>
      </ng-container>
    </app-filter-bar>

    <app-shared-table
      [value]="filteredGrades()"
      [loading]="loading()"
      [columns]="columns"
      [actions]="actions"
      actionsColumnHeader="common.actions"
      actionsColumnWidth="10rem"
      [tableStyle]="{ 'min-width': '40rem' }"
      emptyMessage="common.no_data"
    />
  </p-card>
</div>
